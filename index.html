<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Academic Summit OS</title>
    <script>(function(){var t=null;try{t=localStorage.getItem('as_theme')}catch(e){}if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')})();</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50:'#f0fdf4', 100:'#dcfce7', 500:'#22c55e', 600:'#16a34a', 700:'#15803d', 900:'#14532d' },
                        darkbg: '#090d16',
                        darkcard: '#111827',
                        darkborder: '#1f2937'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        html { scroll-padding-top: env(safe-area-inset-top, 0px); }
        body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 1rem;
        }
        html.dark .card {
            background-color: #111827;
            border-color: #1f2937;
        }

        .hidden-el { display: none !important; }
        .fade-in { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #0f172a;
            transition: all 0.2s;
        }
        html.dark input, html.dark select, html.dark textarea {
            background-color: #0f172a;
            border-color: #1f2937;
            color: #f8fafc;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #16a34a;
            box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.2);
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 10px; }

        @media print {
            .np { display: none !important; }
            body, .card { background: #fff !important; color: #000 !important; border-color: #ccc !important; }
            :root { padding: 0; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg text-slate-900 dark:text-slate-100 min-h-screen font-sans antialiased">

    <!-- AUTH OVERLAY -->
    <div id="auth-container" class="min-h-screen flex items-center justify-center p-5">
        <!-- WELCOME SCREEN -->
        <div id="screen-welcome" class="w-full max-w-sm text-center space-y-5 fade-in">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-brand-600 text-white text-3xl font-black flex items-center justify-center shadow-lg shadow-brand-600/30">S</div>
            <h1 class="text-5xl font-black tracking-tight leading-[1.05]">Academic<br><span class="text-brand-600 dark:text-brand-500">Summit</span></h1>
            <p class="text-lg text-slate-600 dark:text-slate-300 leading-snug">The only companion you need for your academic journey.</p>
            <div class="flex flex-wrap justify-center gap-2 text-xs font-semibold text-slate-500 dark:text-slate-400">
                <span class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800">GPA calculator</span>
                <span class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800">Exam calendar</span>
                <span class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800">Result detective</span>
                <span class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800">Budget</span>
            </div>
            <button onclick="showAuthScreen('screen-signup')" class="w-full py-3 rounded-xl font-bold text-sm text-white bg-brand-600 hover:bg-brand-700 transition">Create account</button>
            <button onclick="showAuthScreen('screen-login')" class="w-full py-3 rounded-xl font-bold text-sm bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-darkborder hover:bg-slate-200 dark:hover:bg-slate-700 transition">Log in</button>
        </div>

        <!-- SIGNUP SCREEN -->
        <div id="screen-signup" class="w-full max-w-sm card p-6 space-y-3 fade-in hidden-el">
            <h2 class="text-xl font-extrabold">Create your account</h2>
            <input type="text" id="su-name" placeholder="Full Name">
            <input type="email" id="su-email" placeholder="Email Address">
            <input type="password" id="su-pass" placeholder="Password (6+ characters)">
            <button onclick="handleSignup()" class="w-full py-3 rounded-xl font-bold text-sm text-white bg-brand-600 hover:bg-brand-700 transition">Sign Up</button>
            <button onclick="showAuthScreen('screen-welcome')" class="w-full text-xs text-slate-500 py-1">Back</button>
        </div>

        <!-- LOGIN SCREEN -->
        <div id="screen-login" class="w-full max-w-sm card p-6 space-y-3 fade-in hidden-el">
            <h2 class="text-xl font-extrabold">Welcome back</h2>
            <input type="email" id="li-email" placeholder="Email Address">
            <input type="password" id="li-pass" placeholder="Password">
            <button onclick="handleLogin()" class="w-full py-3 rounded-xl font-bold text-sm text-white bg-brand-600 hover:bg-brand-700 transition">Log In</button>
            <button onclick="showAuthScreen('screen-welcome')" class="w-full text-xs text-slate-500 py-1">Back</button>
            <p id="auth-error" class="text-xs text-red-500 text-center min-h-[1rem] hidden-el"></p>
        </div>

        <!-- ONBOARDING SCREEN -->
        <div id="screen-onboard" class="w-full max-w-sm card p-6 space-y-4 fade-in hidden-el">
            <div>
                <h2 class="text-xl font-extrabold">Academic Profile</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Initialize your academic system profile.</p>
            </div>
            <div class="space-y-3">
                <input type="text" id="ob-uni" placeholder="University (e.g., University of Abuja)">
                <select id="ob-level">
                    <option value="100">100 Level</option>
                    <option value="200">200 Level</option>
                    <option value="300">300 Level</option>
                    <option value="400">400 Level</option>
                    <option value="500">500 Level</option>
                </select>
                <input type="text" id="ob-program" placeholder="Program (e.g., Political Science)">
                <input type="number" id="ob-total-units" placeholder="Graduation Required Units (e.g., 160)">
                <button onclick="completeOnboard()" class="w-full py-3 rounded-xl font-bold text-sm text-white bg-brand-600 hover:bg-brand-700 transition">Initialize Core Engine</button>
            </div>
        </div>
    </div>

    <!-- MAIN OS APPLICATION -->
    <div id="app-os" class="hidden-el min-h-screen">
        <header class="np lg:hidden flex items-center justify-between px-4 py-3 bg-white dark:bg-darkcard border-b border-slate-200 dark:border-darkborder sticky top-0 z-30">
            <b class="tracking-tight">🏔️ Summit OS</b>
            <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm" aria-label="Toggle theme">🌓</button>
        </header>

        <div class="flex">
            <!-- DESKTOP SIDEBAR -->
            <aside class="np hidden lg:flex flex-col w-60 shrink-0 bg-white dark:bg-darkcard border-r border-slate-200 dark:border-darkborder p-4 sticky top-0 h-screen gap-1">
                <div class="px-2 py-1 mb-2">
                    <h1 class="font-extrabold text-lg">🏔️ Summit OS</h1>
                    <p id="sidebar-profile" class="text-[11px] text-slate-500 dark:text-slate-400 truncate mt-0.5">Loading...</p>
                </div>
                <nav class="flex-1 space-y-1">
                    <button onclick="switchView('home')" class="nav-item w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition" data-target="home">🏠 Dashboard</button>
                    <button onclick="switchView('academics')" class="nav-item w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition" data-target="academics">🧮 Academics</button>
                    <button onclick="switchView('planner')" class="nav-item w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition" data-target="planner">📅 Planner</button>
                    <button onclick="switchView('finance')" class="nav-item w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition" data-target="finance">💰 Finance Centre</button>
                    <button onclick="switchView('more')" class="nav-item w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition" data-target="more">👤 Settings & Materials</button>
                </nav>
                <div class="pt-2 border-t border-slate-200 dark:border-darkborder flex items-center justify-between gap-2">
                    <button onclick="toggleTheme()" class="px-3 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">🌓 Theme</button>
                    <button onclick="logout()" class="px-3 py-2 rounded-xl text-xs font-bold text-red-500 hover:bg-red-500/10 transition">Logout</button>
                </div>
            </aside>

            <!-- MAIN CONTENT AREA -->
            <main id="main-content" class="flex-1 min-w-0 p-4 md:p-8 max-w-5xl mx-auto pb-28 lg:pb-8 space-y-5"></main>
        </div>

        <!-- MOBILE BOTTOM NAVIGATION -->
        <nav class="np lg:hidden fixed bottom-0 inset-x-0 bg-white dark:bg-darkcard border-t border-slate-200 dark:border-darkborder flex overflow-x-auto z-30" style="padding-bottom:env(safe-area-inset-bottom,0px)">
            <button onclick="switchView('home')" class="nav-btn flex-1 min-w-[64px] py-2 flex flex-col items-center text-[10px] font-semibold text-slate-400" data-target="home">
                <span class="text-lg">🏠</span>Home
            </button>
            <button onclick="switchView('academics')" class="nav-btn flex-1 min-w-[64px] py-2 flex flex-col items-center text-[10px] font-semibold text-slate-400" data-target="academics">
                <span class="text-lg">🧮</span>Academics
            </button>
            <button onclick="switchView('planner')" class="nav-btn flex-1 min-w-[64px] py-2 flex flex-col items-center text-[10px] font-semibold text-slate-400" data-target="planner">
                <span class="text-lg">📅</span>Planner
            </button>
            <button onclick="switchView('finance')" class="nav-btn flex-1 min-w-[64px] py-2 flex flex-col items-center text-[10px] font-semibold text-slate-400" data-target="finance">
                <span class="text-lg">💰</span>Finance
            </button>
            <button onclick="switchView('more')" class="nav-btn flex-1 min-w-[64px] py-2 flex flex-col items-center text-[10px] font-semibold text-slate-400" data-target="more">
                <span class="text-lg">👤</span>More
            </button>
        </nav>
    </div>

    <script>
        // =========================================================================
        // 1. THE SINGLE AUTHORITATIVE ACADEMIC ENGINE
        // =========================================================================
        const AcademicEngine = {
            GRADE_MAP: [
                { min: 70, max: 100, letter: 'A', gp: 5 },
                { min: 60, max: 69,  letter: 'B', gp: 4 },
                { min: 50, max: 59,  letter: 'C', gp: 3 },
                { min: 45, max: 49,  letter: 'D', gp: 2 },
                { min: 40, max: 44,  letter: 'E', gp: 1 },
                { min: 0,  max: 39,  letter: 'F', gp: 0 }
            ],

            resolveGrade(scoreOrLetter) {
                if (typeof scoreOrLetter === 'string') {
                    const clean = scoreOrLetter.trim().toUpperCase();
                    const match = this.GRADE_MAP.find(m => m.letter === clean);
                    if (match) return { letter: match.letter, gp: match.gp };
                }
                const score = parseFloat(scoreOrLetter);
                if (isNaN(score)) return { letter: '-', gp: 0 };
                
                for (const range of this.GRADE_MAP) {
                    if (score >= range.min) return { letter: range.letter, gp: range.gp };
                }
                return { letter: 'F', gp: 0 };
            },

            evaluateCourse(course) {
                const units = parseFloat(course.unit || course.units) || 0;
                const score = course.score !== undefined ? parseFloat(course.score) : null;
                const { letter, gp } = this.resolveGrade(score !== null && !isNaN(score) ? score : course.grade);
                const qp = units * gp;

                return {
                    code: (course.code || 'UNKNOWN').toUpperCase().trim(),
                    unit: units,
                    score: score,
                    grade: letter,
                    gp: gp,
                    qp: qp
                };
            },

            evaluateSemester(courses) {
                let semesterUnits = 0;
                let semesterQP = 0;
                const evaluatedCourses = [];

                courses.forEach(c => {
                    const evalC = this.evaluateCourse(c);
                    if (evalC.unit > 0) {
                        evaluatedCourses.push(evalC);
                        semesterUnits += evalC.unit;
                        semesterQP += evalC.qp;
                    }
                });

                const gpa = semesterUnits > 0 ? semesterQP / semesterUnits : 0;

                return {
                    courses: evaluatedCourses,
                    units: semesterUnits,
                    qp: semesterQP,
                    gpa: gpa
                };
            },

            evaluateCumulative(semesters) {
                let cumulativeUnits = 0;
                let cumulativeQP = 0;
                const evaluatedSemesters = [];

                semesters.forEach((sem, idx) => {
                    const evalSem = this.evaluateSemester(sem.courses || []);
                    cumulativeUnits += evalSem.units;
                    cumulativeQP += evalSem.qp;
                    
                    evaluatedSemesters.push({
                        id: sem.id || Date.now() + idx,
                        name: sem.name || `Semester ${idx + 1}`,
                        ...evalSem
                    });
                });

                const cgpa = cumulativeUnits > 0 ? cumulativeQP / cumulativeUnits : 0;

                return {
                    semesters: evaluatedSemesters,
                    cumulativeUnits,
                    cumulativeQP,
                    cgpa
                };
            },

            detectiveAnalysis(gpa1, targetCGPA, existingCumulativeUnits = 0, existingCumulativeQP = 0, assumedSem2Units = 20) {
                const sem1Units = 20; 
                const sem1QP = gpa1 * sem1Units;
                
                const totalUnits = existingCumulativeUnits + sem1Units + assumedSem2Units;
                const targetTotalQP = targetCGPA * totalUnits;
                const requiredSem2QP = targetTotalQP - (existingCumulativeQP + sem1QP);
                const requiredSem2GPA = requiredSem2QP / assumedSem2Units;

                return {
                    sem1Units,
                    sem1QP,
                    assumedSem2Units,
                    requiredSem2QP,
                    requiredSem2GPA,
                    isPossible: requiredSem2GPA >= 0 && requiredSem2GPA <= 5.0
                };
            }
        };

        // =========================================================================
        // 2. STATE & DATABASE ENGINE
        // =========================================================================
        let DB = JSON.parse(localStorage.getItem('as_unified_db_v5')) || { users: {}, current: null };
        let currentUser = null;

        function saveDB() {
            localStorage.setItem('as_unified_db_v5', JSON.stringify(DB));
        }

        function recomputeUserData() {
            if (!currentUser || !currentUser.academic) return;
            const evalResult = AcademicEngine.evaluateCumulative(currentUser.academic.semesters || []);
            currentUser.academic.cgpa = evalResult.cgpa;
            currentUser.academic.totalUnits = evalResult.cumulativeUnits;
            currentUser.academic.cumulativeQP = evalResult.cumulativeQP;
            
            evalResult.semesters.forEach((s, idx) => {
                if (currentUser.academic.semesters[idx]) {
                    currentUser.academic.semesters[idx].gpa = s.gpa;
                    currentUser.academic.semesters[idx].units = s.units;
                    currentUser.academic.semesters[idx].qp = s.qp;
                }
            });
            saveDB();
        }

        // THEME CONTROLLER
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            if (isDark) {
                html.classList.remove('dark');
                localStorage.setItem('as_theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('as_theme', 'dark');
            }
        }

        // AUTH & NAVIGATION SCREENS
        function showAuthScreen(id) {
            ['screen-welcome', 'screen-signup', 'screen-login', 'screen-onboard'].forEach(s => {
                document.getElementById(s).classList.add('hidden-el');
            });
            document.getElementById(id).classList.remove('hidden-el');
        }

        function handleSignup() {
            const name = document.getElementById('su-name').value.trim();
            const email = document.getElementById('su-email').value.trim().toLowerCase();
            const pass = document.getElementById('su-pass').value;

            if (!name || !email || pass.length < 6) return alert("Please complete all fields with a valid password (6+ chars).");
            if (DB.users[email]) return alert("Account with this email already exists.");

            DB.users[email] = {
                name, pass, profile: null,
                academic: { semesters: [], cgpa: 0.00, totalUnits: 0, cumulativeQP: 0, targetCGPA: 4.50 },
                planner: { tasks: [], events: [] },
                finance: { semesterBudget: 150000, transactions: [] }
            };
            DB.current = email;
            saveDB();
            showAuthScreen('screen-onboard');
        }

        function handleLogin() {
            const email = document.getElementById('li-email').value.trim().toLowerCase();
            const pass = document.getElementById('li-pass').value;

            if (!DB.users[email] || DB.users[email].pass !== pass) {
                const err = document.getElementById('auth-error');
                err.textContent = "Invalid email address or password.";
                err.classList.remove('hidden-el');
                return;
            }
            DB.current = email;
            saveDB();
            initApp();
        }

        function completeOnboard() {
            const user = DB.users[DB.current];
            user.profile = {
                uni: document.getElementById('ob-uni').value || 'University of Abuja',
                level: document.getElementById('ob-level').value,
                program: document.getElementById('ob-program').value || 'Political Science & IR',
                totalUnits: parseFloat(document.getElementById('ob-total-units').value) || 160
            };
            saveDB();
            initApp();
        }

        function logout() {
            DB.current = null;
            saveDB();
            location.reload();
        }

        function initApp() {
            if (!DB.current || !DB.users[DB.current]) return showAuthScreen('screen-welcome');
            currentUser = DB.users[DB.current];

            if (!currentUser.profile) return showAuthScreen('screen-onboard');

            recomputeUserData();

            document.getElementById('auth-container').classList.add('hidden-el');
            document.getElementById('app-os').classList.remove('hidden-el');

            const profileText = `${currentUser.profile.uni} • ${currentUser.profile.level}L • ${currentUser.profile.program}`;
            if (document.getElementById('sidebar-profile')) document.getElementById('sidebar-profile').textContent = profileText;

            switchView('home');
        }

        function switchView(viewName) {
            document.querySelectorAll('.nav-item').forEach(b => {
                b.classList.remove('bg-brand-500/10', 'text-brand-600', 'dark:text-brand-500');
                b.classList.add('text-slate-600', 'dark:text-slate-400');
            });
            const activeSide = document.querySelector(`.nav-item[data-target="${viewName}"]`);
            if (activeSide) {
                activeSide.classList.remove('text-slate-600', 'dark:text-slate-400');
                activeSide.classList.add('bg-brand-500/10', 'text-brand-600', 'dark:text-brand-500');
            }

            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('text-brand-600', 'dark:text-brand-500');
                b.classList.add('text-slate-400');
            });
            const activeBtn = document.querySelector(`.nav-btn[data-target="${viewName}"]`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('text-brand-600', 'dark:text-brand-500');
            }

            const main = document.getElementById('main-content');
            main.innerHTML = '';

            if (viewName === 'home') renderHome(main);
            else if (viewName === 'academics') renderAcademics(main);
            else if (viewName === 'planner') renderPlanner(main);
            else if (viewName === 'finance') renderFinance(main);
            else if (viewName === 'more') renderMore(main);
        }

        // =========================================================================
        // VIEW 1: DASHBOARD
        // =========================================================================
        function renderHome(container) {
            recomputeUserData();
            const acad = currentUser.academic;
            const fin = currentUser.finance;
            const totalReq = currentUser.profile.totalUnits || 160;
            const progressPct = Math.min(100, Math.round((acad.totalUnits / totalReq) * 100));
            
            const expenses = fin.transactions.filter(t => t.type === 'expense').reduce((a,b) => a + b.amount, 0);
            const remaining = fin.semesterBudget - expenses;
            const pendingTasks = currentUser.planner.tasks.filter(t => !t.done).length;

            const hr = new Date().getHours();
            const greeting = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';

            const standing = acad.cgpa >= 4.5 ? 'First Class' : acad.cgpa >= 3.5 ? 'Second Class Upper' : acad.cgpa >= 2.4 ? 'Second Class Lower' : acad.cgpa >= 1.5 ? 'Third Class' : acad.cgpa >= 1.0 ? 'Pass' : 'No grades yet';

            const lastSem = acad.semesters.length > 0 ? acad.semesters[acad.semesters.length - 1] : null;
            let diffText = "No previous semester data";
            if (acad.semesters.length > 1) {
                const prevGPA = acad.semesters[acad.semesters.length - 2].gpa;
                const diff = (lastSem.gpa - prevGPA).toFixed(2);
                diffText = diff >= 0 ? `↑ +${diff} shift` : `↓ ${diff} shift`;
            }

            container.innerHTML = `
                <div class="fade-in space-y-5">
                    <div>
                        <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight">${greeting}, ${currentUser.name.split(' ')[0]} 👋</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Academic Summit OS baseline dashboard.</p>
                    </div>

                    <!-- HERO CGPA CARD -->
                    <div class="card flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <p class="text-xs text-slate-400 font-semibold">Cumulative CGPA</p>
                            <p class="text-5xl font-black text-brand-600 dark:text-brand-500">${acad.cgpa.toFixed(2)}<span class="text-base text-slate-400 font-semibold"> / 5.00</span></p>
                            <p class="text-xs font-semibold text-brand-600 dark:text-brand-500 mt-1">${diffText}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-400">${standing}</span>
                    </div>

                    <!-- STATS GRID -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="card">
                            <p class="text-[11px] text-slate-400 font-semibold">Completed Units</p>
                            <p class="text-xl font-extrabold mt-1">${acad.totalUnits} <span class="text-xs font-semibold text-slate-400">/ ${totalReq}</span></p>
                            <p class="text-[10px] text-slate-500 mt-1">${progressPct}% completed</p>
                        </div>

        function addCalcRow(code='', unit=3, score='') {
            calcRows++;
            const div = document.createElement('div');
            div.className = "grid grid-cols-12 gap-2 card p-2.5 items-center fade-in";
            div.id = `cr-${calcRows}`;
            div.innerHTML = `
                <input type="text" placeholder="Code" value="${code}" class="col-span-4 md:col-span-3 p-2 text-xs font-bold uppercase c-code font-mono">
                <input type="number" placeholder="Unit" value="${unit}" class="col-span-2 p-2 text-xs text-center font-bold c-unit">
                <input type="number" placeholder="Score" value="${score}" class="col-span-4 md:col-span-5 p-2 text-xs text-center font-bold c-score" oninput="updateRowGrade(this)">
                <span class="col-span-1 text-xs font-black text-center c-grade text-slate-400">-</span>
                <button onclick="document.getElementById('cr-${calcRows}').remove()" class="col-span-1 text-red-500 text-sm font-bold text-center">✕</button>
            `;
            document.getElementById('calc-rows').appendChild(div);
            if(score !== '') updateRowGrade(div.querySelector('.c-score'));
        }

        function updateRowGrade(input) {
            const row = input.closest('.grid');
            const scoreVal = input.value.trim();
            const resolved = AcademicEngine.resolveGrade(scoreVal);

            const span = row.querySelector('.c-grade');
            span.textContent = resolved.letter;
            span.className = `col-span-1 text-xs font-black text-center c-grade ${
                resolved.letter === 'A' ? 'text-brand-600 dark:text-brand-500' : resolved.letter === 'B' ? 'text-blue-500' : resolved.letter === 'C' ? 'text-amber-500' : resolved.letter === 'F' ? 'text-red-500' : 'text-slate-400'
            }`;
        }

        function togglePasteModal() {
            document.getElementById('paste-modal').classList.toggle('hidden-el');
        }

        function processPaste() {
            const text = document.getElementById('paste-area').value;
            const codes = [...text.matchAll(/\b([A-Z]{2,4}-?[A-Z]{0,3}\d{3})\b/g)].map(m => m[1]);
            const unique = [...new Set(codes)].filter(c => /^[A-Z]/.test(c));

            if (unique.length === 0) return alert("No valid course codes found in pasted text.");

            document.getElementById('calc-rows').innerHTML = '';
            calcRows = 0;
            unique.forEach(code => {
                const idx = text.indexOf(code);
                const snippet = text.substring(idx, idx + 60);
                const unitMatch = snippet.match(/\b([1-6])\b/);
                const scoreMatch = snippet.match(/\b([4-9][0-9]|100)\b/);
                addCalcRow(code, unitMatch ? unitMatch[1] : 3, scoreMatch ? scoreMatch[1] : '');
            });
            togglePasteModal();
        }

        function submitCalc() {
            const rows = document.querySelectorAll('#calc-rows > div');
            const coursesToEvaluate = [];

            rows.forEach(r => {
                const code = r.querySelector('.c-code').value.toUpperCase().trim();
                const unit = parseFloat(r.querySelector('.c-unit').value) || 0;
                const scoreVal = r.querySelector('.c-score').value.trim();
                if (code && unit > 0 && scoreVal !== '') {
                    coursesToEvaluate.push({ code, unit, score: scoreVal });
                }
            });

            if (coursesToEvaluate.length === 0) return alert("Please enter at least one valid course with unit and score.");

            const semEval = AcademicEngine.evaluateSemester(coursesToEvaluate);

            currentUser.academic.semesters.push({
                id: Date.now(),
                name: `Semester ${currentUser.academic.semesters.length + 1}`,
                gpa: semEval.gpa,
                courses: semEval.courses,
                units: semEval.units,
                qp: semEval.qp
            });

            currentUser.academic.targetCGPA = parseFloat(document.getElementById('calc-target').value) || currentUser.academic.targetCGPA;

            recomputeUserData();
            alert(`Calculated Semester GPA: ${semEval.gpa.toFixed(2)}\nNew Cumulative CGPA: ${currentUser.academic.cgpa.toFixed(2)}`);
            switchView('home');
        }

        function runDetective() {
            const gpa1 = parseFloat(document.getElementById('det-1st').value);
            const cgpa = parseFloat(document.getElementById('det-curr').value);
            const res = document.getElementById('det-results');

            if (isNaN(gpa1) || isNaN(cgpa)) return alert("Please enter both GPA values.");

            const cumUnitsExceptSem1 = currentUser.academic.totalUnits - (currentUser.academic.semesters.length > 0 ? currentUser.academic.semesters[currentUser.academic.semesters.length - 1].units : 0);
            const cumQPExceptSem1 = currentUser.academic.cumulativeQP - (currentUser.academic.semesters.length > 0 ? currentUser.academic.semesters[currentUser.academic.semesters.length - 1].qp : 0);

            const analysis = AcademicEngine.detectiveAnalysis(gpa1, cgpa, cumUnitsExceptSem1, cumQPExceptSem1, 20);

            let html = '';
            
            html += `
                <div class="card space-y-1">

                    <div class="text-xs font-mono text-slate-500 dark:text-slate-400 space-y-0.5">
                        <p>Sem 1: ${analysis.sem1Units} Units × ${gpa1.toFixed(2)} GPA = ${analysis.sem1QP.toFixed(1)} QP</p>
                        <p>Equation: Total QP / (${analysis.sem1Units + analysis.assumedSem2Units + cumUnitsExceptSem1} Total Units) = ${cgpa.toFixed(2)}</p>
                    </div>
                </div>
            `;

            if (!analysis.isPossible) {
                html += `
                    <div class="card border-red-500/40 text-red-500">
                        <p class="font-bold text-xs uppercase tracking-wider">Sanity Alert ⚠️</p>
                        <p class="text-xs mt-1">
                            Calculated required 2nd Semester GPA is <b>${analysis.requiredSem2GPA.toFixed(2)}</b> (outside 0.00-5.00 bounds). Double check portal entries.
                        </p>
                    </div>
                `;
            } else {
                html += `
                    <div class="card space-y-1">
                        <p class="text-xs font-bold text-brand-600 dark:text-brand-500 uppercase tracking-wider">Reverse Computed 2nd Sem GPA</p>
                        <p class="text-sm">
                            Required 2nd Semester GPA is <b class="text-brand-600 dark:text-brand-500">${analysis.requiredSem2GPA.toFixed(2)}</b> (${analysis.requiredSem2QP.toFixed(0)} Quality Points across ${analysis.assumedSem2Units} units).
                        </p>
                    </div>
                `;

                const targetPoints = analysis.requiredSem2QP;
                html += `
                    <div class="card space-y-2">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Grade Scenarios</p>
                        <p class="text-xs text-slate-500">Predicted grade patterns to reach ${targetPoints.toFixed(0)} QP over 20 units:</p>

                            <span class="px-2.5 py-1 rounded-lg bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-400">A Grades (5GP): ~${Math.max(0, Math.round((analysis.requiredSem2GPA - 3) * 5))}</span>
                            <span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800">B Grades (4GP): Balance</span>
                        </div>
                    </div>
                `;
            }

            res.innerHTML = html;
        }

                <div class="fade-in space-y-5">
                    <div>
                        <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight">Planner & Calendar</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Organize your academic tasks and track upcoming exam dates.</p>
                    </div>

                    <div class="card space-y-3">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Add Exam / Event</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="text" id="ev-code" placeholder="Course / Title (e.g. POS201)">
                            <select id="ev-type">
                                <option>Exam</option>
                                <option>Test</option>
                                <option>Assignment</option>
                            </select>
                            <input type="date" id="ev-date">
                        </div>
                        <button onclick="addEvent()" class="w-full py-2.5 rounded-xl font-bold text-xs text-white bg-brand-600 hover:bg-brand-700 transition">Add To Calendar</button>
                    </div>

                    <div class="card space-y-3">
                        <h3 class="font-extrabold text-base">Calendar Schedules</h3>
                        <div id="event-list" class="space-y-2">
                            ${(currentUser.planner.events || []).map((e, i) => `
                                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder text-xs">
                                    <div>
                                        <p class="font-bold">${e.code} <span class="text-[10px] text-slate-400">(${e.type})</span></p>
                                        <p class="text-slate-500">${e.date}</p>
                                    </div>
                                    <button onclick="deleteEvent(${i})" class="text-red-500 font-bold px-2">✕</button>
                                </div>
                            `).join('') || '<p class="text-xs text-slate-500 text-center py-2">No calendar events added.</p>'}
                        </div>
                    </div>

                    <div class="card space-y-3">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Add Academic Task</label>
                        <div class="flex gap-2">
                            <input type="text" id="task-input" placeholder="e.g., Read Chapter 4 of POS 201">
                            <button onclick="addTask()" class="px-5 py-3 rounded-xl font-bold text-xs text-white bg-brand-600 hover:bg-brand-700 transition shrink-0">Add</button>
                        </div>
                    </div>

                    <div class="card space-y-3">
                        <h3 class="font-extrabold text-base">Task List</h3>
                        <div id="task-list" class="space-y-2">
                            ${currentUser.planner.tasks.map((t, i) => `
                                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder">
                                    <div class="flex items-center gap-3">
                                        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${i})" class="w-4 h-4 rounded accent-brand-600">
                                        <span class="text-xs font-semibold ${t.done ? 'line-through text-slate-400' : ''}">${t.title}</span>
                                    </div>
                                    <button onclick="deleteTask(${i})" class="text-red-500 text-xs font-bold px-2">✕</button>
                                </div>
                            `).join('') || '<p class="text-xs text-slate-500 text-center py-4">No tasks added yet.</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function addEvent() {
            const code = document.getElementById('ev-code').value.trim();
            const type = document.getElementById('ev-type').value;
            const date = document.getElementById('ev-date').value;
            if(!code || !date) return alert('Enter course title and date.');
            currentUser.planner.events = currentUser.planner.events || [];
            currentUser.planner.events.push({ code, type, date });
            saveDB();
            switchView('planner');
        }

        function deleteEvent(i) {
            currentUser.planner.events.splice(i, 1);
            saveDB();
            switchView('planner');
        }

        function addTask() {
            const input = document.getElementById('task-input');
            if (!input.value.trim()) return;
            currentUser.planner.tasks.push({ title: input.value.trim(), done: false });
            saveDB();
            switchView('planner');
        }

        function toggleTask(i) {
            currentUser.planner.tasks[i].done = !currentUser.planner.tasks[i].done;
            saveDB();
            switchView('planner');
        }

        function deleteTask(i) {
            currentUser.planner.tasks.splice(i, 1);
            saveDB();
            switchView('planner');
        }

        // VIEW 4: FINANCE
        function renderFinance(container) {
            const fin = currentUser.finance;
            const spent = fin.transactions.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
            const remaining = fin.semesterBudget - spent;

            container.innerHTML = `
                <div class="fade-in space-y-5">
                    <div>
                        <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight">Finance & Budget</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Set your allowance and track expenses.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="card">
                            <p class="text-[11px] text-slate-400 font-semibold">Semester Budget</p>
                            <p class="text-2xl font-extrabold mt-1">₦${fin.semesterBudget.toLocaleString()}</p>
                        </div>
                        <div class="card">
                            <p class="text-[11px] text-slate-400 font-semibold">Total Spent</p>
                            <p class="text-2xl font-extrabold text-red-500 mt-1">₦${spent.toLocaleString()}</p>
                        </div>
                        <div class="card">
                            <p class="text-[11px] text-slate-400 font-semibold">Remaining Balance</p>
                            <p class="text-2xl font-extrabold text-brand-600 dark:text-brand-500 mt-1">₦${remaining.toLocaleString()}</p>
                        </div>
                    </div>

                    <div class="card space-y-3">
                        <h3 class="font-extrabold text-base">Update Budget Limit</h3>
                        <div class="flex gap-2">
                            <input type="number" id="budget-input" value="${fin.semesterBudget}" placeholder="Semester Budget (₦)">
                            <button onclick="updateBudget()" class="px-5 py-3 rounded-xl font-bold text-xs text-white bg-brand-600 hover:bg-brand-700 transition shrink-0">Save</button>
                        </div>
                    </div>

                    <div class="card space-y-3">
                        <h3 class="font-extrabold text-base">Log Expense</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <input type="number" id="fin-amt" placeholder="Amount (₦)">
                            <input type="text" id="fin-desc" placeholder="Description (e.g., Handouts)">
                            <button onclick="addTransaction()" class="py-3 rounded-xl text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 transition">Log Transaction</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateBudget() {
            const val = parseFloat(document.getElementById('budget-input').value);
            if(isNaN(val) || val < 0) return alert('Enter a valid budget amount.');
            currentUser.finance.semesterBudget = val;
            saveDB();
            switchView('finance');
        }

        function addTransaction() {
            const amt = parseFloat(document.getElementById('fin-amt').value);
            const desc = document.getElementById('fin-desc').value.trim();
            if (!amt || !desc) return alert("Please complete both amount and description.");

            currentUser.finance.transactions.push({ amount: amt, desc, type: 'expense', date: Date.now() });
            saveDB();
            switchView('finance');
        }

        // VIEW 5: MORE / SETTINGS / BACKUP
        function renderMore(container) {
            container.innerHTML = `
                <div class="fade-in space-y-5">
                    <div>
                        <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight">Settings & Materials</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">System status, backup, and account settings.</p>
                    </div>

                    <div class="card space-y-3">
                        <h3 class="font-extrabold text-base">Profile Info</h3>
                        <div class="text-xs space-y-1.5 text-slate-500 dark:text-slate-400">
                            <p><b>User:</b> ${currentUser.name} (${DB.current})</p>
                            <p><b>Institution:</b> ${currentUser.profile.uni}</p>
                            <p><b>Program:</b> ${currentUser.profile.program}</p>
                            <p><b>Engine:</b> Authoritative Academic Engine v5.0</p>
                        </div>
                    </div>

                    <div class="card space-y-3">
                        <h3 class="font-extrabold text-base">Backup & Restore</h3>
                        <textarea id="bk-area" rows="3" class="font-mono text-[11px]" placeholder="Backup text will appear here..."></textarea>
                        <div class="flex gap-2">
                            <button onclick="createBackup()" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200">Create Backup</button>
                            <button onclick="restoreBackup()" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200">Restore Data</button>
                        </div>
                    </div>

                    <div class="card border-red-500/20 space-y-3">
                        <h3 class="font-bold text-xs text-red-500 uppercase tracking-wider">Danger Zone</h3>
                        <button onclick="if(confirm('Reset all academic data?')){localStorage.clear(); location.reload();}" class="w-full py-3 rounded-xl text-xs font-bold text-red-500 bg-red-500/10 hover:bg-red-500/20 transition">
                            Clear Local Storage Data
                        </button>
                    </div>
                </div>
            `;
        }

        function createBackup() {
            document.getElementById('bk-area').value = JSON.stringify(currentUser);
        }

        function restoreBackup() {
            try {
                const data = JSON.parse(document.getElementById('bk-area').value);
                if(!data.academic || !data.profile) throw new Error();
                DB.users[DB.current] = data;
                currentUser = data;
                saveDB();
                alert('Backup successfully restored!');
                switchView('home');
            } catch(e) {
                alert('Invalid backup data format.');
            }
        }

        // APPLICATION INITIALIZATION
        window.onload = function() {
            if (DB.current && DB.users[DB.current]) {
                initApp();
            } else {
                showAuthScreen('screen-welcome');
            }
        };
    </script>
</body>
</html>
