// smart goals
function goalStatus(g){
  const m=g.title.match(/(\d\.\d{1,2})/);
  if(!m)return g.done?['Done','emerald']:['Active','slate'];
  const t=+m[1],c=cum().g;

  return[c>=t-0.5?'On track':'Behind','violet'];
}

function parsePasteTrojan(){
  try{
    const rawText=$('paste-a').value;
    if(!rawText.trim())return showToast('Paste portal text first','error');
    const lines=rawText.split('\n').map(l=>l.trim()).filter(Boolean);
    const out=[];
    const codeRe=/^((?:[A-Z]{2,4}-)?[A-Z]{2,4}\d{3}[A-Z]?)(?=\s|$)/;
    const isUnit=v=>/^[1-6]$/.test(v);
    const isGrade=v=>/^[A-F]$/.test(v);
    const isScore=v=>/^\d{1,3}$/.test(v)&&+v<=100;
    for(let i=0;i<lines.length;i++){
      const m=lines[i].match(codeRe);
      if(!m)continue;
      const code=m[1].replace(/^[A-Z]{2,4}-/,'').toUpperCase();
      let unit=3,score='';
      if(isUnit(lines[i+1]||'')){
        unit=+lines[i+1];
        if(isScore(lines[i+3]||'')&&isGrade(lines[i+4]||''))score=lines[i+3];
      }else{
        const nums=(lines[i].slice(m[0].length).match(/\b\d{1,3}\b/g)||[]).map(Number);
        const u=nums.find(n=>n>=1&&n<=6);
        if(u)unit=u;
        const s=nums.slice(nums.indexOf(u)+1).filter(n=>n<=100).pop();
        if(s!==undefined)score=String(s);
      }
      out.push([code,unit,score]);
    }
    if(!out.length)return showToast('No course patterns found in text','error');
    $('rows').innerHTML='';rowN=0;
    out.forEach(o=>addRow(...o));
    $('paste').classList.add('hidden');
    showToast('Parsed '+out.length+' courses from portal text!');
    const matricMatch=rawText.match(/\b(\d{2}\/[A-Z0-9]{2,8}\/[A-Z0-9]{2,8})\b/i)||rawText.match(/\b(20\d{2}\/?\d{6,7})\b/);
    if(matricMatch){
      const m=matricMatch[0].toUpperCase();
      if(m!==U.profile.matric)askMatric(m);
    }
  }catch(e){showToast('Parse error: '+e.message,'error');}
}

async function startAttendanceSession(){
  const{data,error}=await sb.rpc('start_session',{p_course:$('lec-course').value.trim()||'POS 204',p_topic:$('lec-topic').value.trim()});
  if(error)return showToast(error.message,'error');
  const s=data[0],end=new Date(s.s_expires).getTime();
  clearInterval(timerInterval);clearInterval(pollT);
  $('otp-display').innerText=s.s_code;
  const tick=()=>{
    if(!$('otp-display')){clearInterval(timerInterval);clearInterval(pollT);return;}
    const left=Math.max(0,Math.round((end-Date.now())/1000));
    $('timer-display').innerText=left?('Expires in '+left+'s'):'Session closed';
    if(!left){$('otp-display').innerText='EXPIRED';clearInterval(timerInterval);}
  };
  const poll=async()=>{
    const{count}=await sb.from('attendance').select('id',{count:'exact',head:true}).eq('session_id',s.s_id);
    if($('sub-count'))$('sub-count').innerText=(count||0)+' Present';
    if(Date.now()>end+5000)clearInterval(pollT);
  };
  tick();poll();
  timerInterval=setInterval(tick,1000);pollT=setInterval(poll,3000);
}

<script>
function parseReg(t){
  const L=String(t).split('\n').map(function(x){return x.trim();}).filter(Boolean);
  const out=[[],[]];let sem=0;
  const full=/^(?:\d{1,2} )?((?:UA-)?[A-Z]{2,4}\d{3}[A-Z]?) .*?\b([1-6]) ([CE])$/i;
  const lone=/^(?:\d{1,2} )?((?:UA-)?[A-Z]{2,4}\d{3}[A-Z]?)$/i;
  const add=function(code,u,st){
    const c=code.toUpperCase().replace(/^UA-/,'');
    if(!out[sem].some(function(r){return r.code===c;}))out[sem].push({code:c,unit:+u,st:st.toUpperCase()});
  };
  for(let i=0;i<L.length;i++){
    const ln=L[i].replace(/\s+/g,' ');
    if(/^total/i.test(ln)){if(out[sem].length&&sem<1)sem=1;continue;}
    let m=ln.match(full);
    if(m){add(m[1],m[2],m[3]);continue;}
    m=ln.match(lone);
    if(m){
      for(let k=1;k<=4;k++){
        if(/^[1-6]$/.test(L[i+k]||'')&&/^[CE]$/i.test(L[i+k+1]||'')){add(m[1],L[i+k],L[i+k+1]);i+=k+1;break;}
      }
    }
  }
  return out;
}
function decCalc(D){
  const a=D[0].reduce(function(x,r){return x+r.unit;},0),b=D[1].reduce(function(x,r){return x+r.unit;},0);
  return{u:[a,b],den:(a&&b)?a+b:2*(a||b)};
}
ACAD.dec=function(){
  const D=U.dec=U.dec||[[],[]],K=decCalc(D);
  const G=[['A',5],['B',4],['C',3],['D',2],['E',1],['F',0]];
  const fx=function(v){return v.toFixed(3);};
  const tbl=function(si,name){
    const R=D[si];
    if(!R.length)return '<div class="text-xs text-slate-400 p-4 rounded-2xl border border-dashed text-center" style="border-color:var(--bd)">No courses added for '+name+' yet.</div>';
    const head='<tr><th class="p-2 font-sans font-extrabold">Course</th>'+G.map(function(g){return '<th class="p-2 text-center font-extrabold">'+g[0]+'</th>';}).join('')+'<th></th></tr>';
    const rows=R.map(function(r,i){
      return '<tr class="border-t" style="border-color:var(--bd)"><td class="p-2 font-sans"><b class="font-mono">'+esc(r.code)+'</b><div class="text-[10px] text-slate-400">'+r.unit+'u '+(r.st==='E'?'Elective':'Compulsory')+'</div></td>'+G.map(function(g){return '<td class="p-2 text-center '+(g[0]==='A'?'font-extrabold text-emerald-600 dark:text-emerald-400':'')+'">'+fx(K.den?g[1]*r.unit/K.den:0)+'</td>';}).join('')+'<td class="p-2"><button class="text-slate-400" onclick="decDel('+si+','+i+')">'+ic('x','w-3 h-3')+'</button></td></tr>';
    }).join('');
    const tot='<tr class="border-t-2 font-extrabold" style="border-color:var(--bd)"><td class="p-2 font-sans">Total</td>'+G.map(function(g){return '<td class="p-2 text-center">'+fx(K.den?g[1]*K.u[si]/K.den:0)+'</td>';}).join('')+'<td></td></tr>';
    return '<div class="space-y-2"><div class="flex justify-between text-xs"><b>'+name+'</b><span class="text-slate-400">'+K.u[si]+' units</span></div><div class="overflow-x-auto"><table class="w-full text-[11px] text-left font-mono"><thead class="text-slate-400">'+head+'</thead><tbody>'+rows+tot+'</tbody></table></div></div>';
  };
  const note=(K.u[0]&&K.u[1])?'Both semesters added. If you score A in every course, the two semesters add up to 5.000.':(K.u[0]||K.u[1])?'One semester added. A semester is worth half of the session, so an all-A semester adds up to 2.500. Add your other semester to complete it.':'Paste your course registration above to begin.';
  $('sub').innerHTML='<div class="space-y-5"><div class="card p-6 space-y-4"><div><div class="font-extrabold">Menu of Decimals</div><p class="text-xs text-slate-500 mt-1">See exactly what every grade is worth in each of your courses. Each number is how much that grade adds to your CGPA.</p></div><textarea id="d-paste" rows="4" class="inp font-mono text-xs" placeholder="Paste your course registration page text here..."></textarea><div class="flex gap-2 items-center"><select id="d-tgt" class="inp" style="width:auto"><option value="1">If one semester: First</option><option value="2">If one semester: Second</option></select><button class="btn flex-1" onclick="decParse()">Read Registration</button></div><div class="grid grid-cols-12 gap-2 pt-3 border-t" style="border-color:var(--bd)"><input id="d-code" class="inp col-span-5 uppercase font-mono" placeholder="Code"><input id="d-unit" type="number" class="inp col-span-3" placeholder="Units"><select id="d-s" class="inp col-span-4"><option value="1">1st Sem</option><option value="2">2nd Sem</option></select></div><button class="btn2 w-full" onclick="decAdd()">Add Course Manually</button></div><div class="card p-6 space-y-5">'+tbl(0,'First Semester')+tbl(1,'Second Semester')+'<p class="text-xs text-slate-500">'+note+'</p>'+((D[0].length||D[1].length)?'<button class="text-xs font-bold text-rose-500" onclick="decClear()">Clear all courses</button>':'')+'</div></div>';
};
function decParse(){
  const t=$('d-paste').value;
  if(!t.trim())return showToast('Paste your course registration first','error');
  const r=parseReg(t);
  if(!r[0].length&&!r[1].length)return showToast('No courses found in that text','error');
  U.dec=U.dec||[[],[]];
  if(r[0].length&&r[1].length)U.dec=r;
  else U.dec[$('d-tgt').value==='2'?1:0]=r[0].length?r[0]:r[1];
  save();go('acad');showToast('Registration loaded: '+(U.dec[0].length+U.dec[1].length)+' courses');
}
function decAdd(){
  const code=$('d-code').value.trim().toUpperCase().replace(/^UA-/,'').replace(/\s/g,''),unit=parseFloat($('d-unit').value),si=$('d-s').value==='2'?1:0;
  if(!/^[A-Z]{2,4}\d{3}[A-Z]?$/.test(code)||!(unit>0&&unit<=6))return showToast('Enter a course code and units (1-6)','error');
  U.dec=U.dec||[[],[]];U.dec[si].push({code:code,unit:unit,st:'C'});
  save();go('acad');
}
function decDel(si,i){U.dec[si].splice(i,1);save();go('acad');}
function decClear(){if(!confirm('Clear all courses from this tab?'))return;U.dec=[[],[]];save();go('acad');}
</script>

<script>
const semPrint=s=>(s.name||'')+'|'+(s.courses||[]).map(c=>c.code+':'+c.unit+':'+c.score).sort().join(',');
function dedupeSems(){
  const seen={},keep=[];
  (U.semesters||[]).forEach(s=>{const k=semPrint(s);if(!seen[k]){seen[k]=1;keep.push(s);}});
  const removed=(U.semesters||[]).length-keep.length;
  U.semesters=keep;return removed;
}
function saveSem(){
  const courses=[];
  document.querySelectorAll('#rows > div').forEach(r=>{
    const code=r.querySelector('.c-code').value.trim().toUpperCase();
    const unit=parseFloat(r.querySelector('.c-unit').value);
    const sc=r.querySelector('.c-score').value;
    if(code&&unit>0&&sc!==''&&+sc>=0&&+sc<=100&&!courses.some(c=>c.code===code))courses.push({code,unit,score:+sc});
  });
  if(!courses.length)return showToast('Enter at least one valid course with score (0-100)','error');
  const name=$('c-name').value.trim()||('Semester '+(U.semesters.length+1));
  if(editing!==null){
    const s=U.semesters.find(x=>x.id===editing);
    s.name=name;s.courses=courses;editing=null;
  }else{
    const print=semPrint({name,courses});
    const exact=U.semesters.find(s=>semPrint(s)===print);
    if(exact)return showToast('Already recorded - duplicate blocked','error');
    const sameName=U.semesters.find(s=>(s.name||'')===name);
    if(sameName){
      if(!confirm(name+' exists with different results. Replace it?'))return;
      sameName.courses=courses;
    }else U.semesters.push({id:Date.now(),name,courses});
  }
  save();
  const x=semS({courses}),c=cum();
  go('home');showToast('Saved! Semester GPA: '+x.g.toFixed(2)+' | New CGPA: '+c.g.toFixed(2));
}
var _dd=setInterval(function(){
  if(U&&U.semesters){clearInterval(_dd);var n=dedupeSems();if(n){save();showToast('Cleaned '+n+' duplicate semester(s)');}}
},2000);
</script>

<script>
function scanCarryovers(){
  const all=[];
  U.semesters.forEach(function(s,si){(s.courses||[]).forEach(function(c,ci){all.push({si:si,ci:ci,code:c.code,score:c.score,unit:c.unit});});});
  U.semesters.forEach(function(s){(s.courses||[]).forEach(function(c){delete c.sup;});});
  const by={};
  all.forEach(function(a){(by[a.code]=by[a.code]||[]).push(a);});
  const owed=[];
  Object.keys(by).forEach(function(code){
    const list=by[code];
    list.forEach(function(a){
      if(gr(a.score)[1]!==0)return;
      const later=list.find(function(b){return b.si>a.si&&gr(b.score)[1]>0;});
      if(later){U.semesters[a.si].courses[a.ci].sup=true;}
      else owed.push({code:code,unit:a.unit,score:a.score,sem:U.semesters[a.si].name});
    });
  });
  return owed;
}
function refreshCarry(){if(!U||!U.semesters)return;U.carry=scanCarryovers();save();}
var _cr=setInterval(function(){if(U&&U.semesters){clearInterval(_cr);refreshCarry();}},2500);
function carryCard(){
  const owed=(U&&U.carry)||[];
  const log=(U&&U.cgpaLog)||[];
  const last=log.length?log[log.length-1]:null;
  var h='<div class="card p-5 space-y-2 mt-5">';
  h+='<div class="lbl">Carryover Register</div>';
  if(!owed.length){h+='<p class="text-xs text-slate-500">No outstanding carryovers. Clean sheet.</p>';}
  else{h+=owed.map(function(o){return '<div class="flex justify-between text-xs p-3 rounded-xl bg-rose-50 dark:bg-rose-950/30"><b>'+esc(o.code)+' ('+o.unit+'u)</b><span>failed '+esc(o.score)+' in '+esc(o.sem)+'</span></div>';}).join('');
    h+='<p class="text-[11px] text-slate-400">Retake these, then paste the new result — the retake replaces the F in your CGPA automatically (↺).</p>';}
  if(last){h+='<p class="text-[11px] text-slate-400">Live CGPA '+last.g.toFixed(2)+(last.d?(' ('+(last.d>=0?'+':'')+last.d.toFixed(2)+' this wave)'):'')+'. As more results drop, paste again — it shifts in real time.</p>';}
  return h+'</div>';
}
const _homeC=V.home;

function saveSem(){
  const courses=[];
  document.querySelectorAll('#rows > div').forEach(function(r){
    const code=r.querySelector('.c-code').value.trim().toUpperCase();
    const unit=parseFloat(r.querySelector('.c-unit').value);
    const sc=r.querySelector('.c-score').value;
    if(code&&unit>=1&&unit<=6&&sc!==''&&+sc>=0&&+sc<=100&&!courses.some(function(c){return c.code===c.code&&false;}))courses.push({code:code,unit:unit,score:+sc});
  });
  if(!courses.length)return showToast('Enter at least one valid course with score (0-100)','error');
  const name=$('c-name').value.trim()||('Semester '+(U.semesters.length+1));
  if(editing!==null){
    const s=U.semesters.find(function(x){return x.id===editing;});
    s.name=name;s.courses=courses;editing=null;
    save();refreshCarry();
    const x=semS(s),c=cum();
    go('home');showToast('Updated! GPA '+x.g.toFixed(2)+' | CGPA '+c.g.toFixed(2));
    return;
  }
  const print=semPrint({name:name,courses:courses});
  const exact=U.semesters.find(function(s){return semPrint(s)===print;});
  if(exact)return showToast('Already recorded - duplicate blocked','error');
  const codes=courses.map(function(c){return c.code;});
  const match=U.semesters.find(function(s){
    const sc=(s.courses||[]).map(function(c){return c.code;});
    const hit=codes.filter(function(c){return sc.indexOf(c)>-1;}).length;
    return codes.length&&hit/codes.length>=0.6;
  });
  if(match){
    const before=cum().g;
    let upd=0,add=0;
    courses.forEach(function(c){
      const ex=match.courses.find(function(x){return x.code===c.code;});
      if(ex){if(ex.score!==c.score||ex.unit!==c.unit){ex.score=c.score;ex.unit=c.unit;upd++;}}
      else{match.courses.push(c);add++;}
    });
    save();refreshCarry();
    const after=cum().g;
    U.cgpaLog=U.cgpaLog||[];
    U.cgpaLog.push({t:Date.now(),g:after,d:after-before});
    save();
    if(window.posthog)posthog.capture('semester_merged',{updated:upd,added:add});
    go('home');
    showToast('Merged: '+upd+' updated, '+add+' added. CGPA '+after.toFixed(2)+' ('+(after-before>=0?'+':'')+(after-before).toFixed(2)+')');
    return;
  }
  const sameName=U.semesters.find(function(s){return (s.name||'')===name;});
  if(sameName){
    if(!confirm(name+' exists with different results. Replace it?'))return;
    sameName.courses=courses;
  }else U.semesters.push({id:Date.now(),name:name,courses:courses});
  save();refreshCarry();
  const x=semS({courses:courses}),c=cum();
  go('home');showToast('Saved! Semester GPA: '+x.g.toFixed(2)+' | New CGPA: '+c.g.toFixed(2));
}

  sp.push('<div style="width:160px;height:3px;border-radius:2px;background:#0d3f2e;overflow:hidden;margin-top:6px">');
  sp.push('<div id="splash-bar" style="width:0%;height:100%;background:linear-gradient(90deg,#059669,#06b6d4);transition:width .25s"></div></div>');
  sp.push('<div id="splash-tag" style="color:#6ee7b7;font-size:11px;font-weight:600">Academic success, within reach.</div></div>');
  document.body.insertAdjacentHTML('afterbegin',sp.join(''));
  var pct=0;
  var fill=setInterval(function(){
    if(splashDone){clearInterval(fill);return;}
    var b=document.getElementById('splash-bar');
    if(!b){clearInterval(fill);return;}
    if(pct<90){pct+=(90-pct)*0.07+0.5;b.style.width=Math.min(90,pct).toFixed(1)+'%';}
  },120);
  window.addEventListener('load',function(){if(pct<92)pct=92;});
})();
</script>
<script>
function runDet(){
  const g1=parseFloat($('d1').value),cg=parseFloat($('dc').value);
  const u1=parseFloat($('du1').value)||20,u2=parseFloat($('du2').value)||20;
  if(isNaN(g1)||isNaN(cg))return showToast('Enter both GPA values','error');
  const q1=g1*u1,ut=u1+u2,qt=cg*ut,gap=qt-q1,need=gap/u2;
  const step=(n,b,col)=>'<div class="p-4 rounded-2xl space-y-1" style="background:var(--sub);border-left:3px solid '+col+'"><div class="lbl" style="color:'+col+'">'+n+'</div><p class="text-xs leading-relaxed">'+b+'</p></div>';
  var h='<div class="space-y-3">';
  h+=step('Step 1 - Your starting point','Before these new results you had <b>'+u1+'</b> units at a CGPA of <b>'+g1.toFixed(2)+'</b> - that is <b>'+q1.toFixed(2)+'</b> grade points already banked. That number is real work. It counts.','#10b981');
  h+=step('Step 2 - Where you are aiming','Your portal (or your target) reads <b>'+cg.toFixed(2)+'</b> across <b>'+ut+'</b> units. To hold that average you need <b>'+qt.toFixed(2)+'</b> grade points in total.','#06b6d4');
  h+=step('Step 3 - The exact gap','The distance is <b>'+gap.toFixed(2)+'</b> grade points, to be earned in your <b>'+u2+'</b> pending units - an average of <b>'+need.toFixed(2)+'</b> in those courses.','#f59e0b');
  const G=[['A',5],['B',4],['C',3],['D',2],['E',1]];
  const combos=G.map(g=>({g:g[0],v:g[1],d:Math.abs(g[1]-need)})).sort((a,b)=>a.d-b.d).slice(0,3);
  h+='<div class="p-4 rounded-2xl space-y-2" style="background:var(--sub)"><div class="lbl">What it looks like in grades (closest first)</div>'+combos.map(c=>'<div class="flex justify-between text-xs"><span>Every pending course at <b>'+c.g+'</b></span><b>'+c.v.toFixed(2)+'</b></div>').join('')+'</div>';
  if(need>=0&&need<=5){
    h+='<div class="p-4 rounded-2xl text-xs leading-relaxed" style="background:rgba(16,185,129,.12)"><b>We see you.</b> '+q1.toFixed(0)+' points got you here - that is effort, not luck. A '+need.toFixed(2)+' average across your next '+u2+' units keeps the dream alive, and the grade picture above shows it is within reach. One course at a time.</div>';
  }else if(need>5){
    h+='<div class="p-4 rounded-2xl text-xs leading-relaxed" style="background:rgba(244,63,94,.12)"><b>Honest, not harsh:</b> '+need.toFixed(2)+' sits above the 5.0 ceiling, so this exact target cannot be reached in '+u2+' units alone - and that is arithmetic, not a verdict on you. Widen the units (more semesters lie ahead) or let the target breathe. Your climb is still real.</div>';
  }else{
    h+='<div class="p-4 rounded-2xl text-xs leading-relaxed" style="background:rgba(16,185,129,.12)"><b>Good news:</b> your banked points already cover this target - the pending units only need to stay above '+Math.max(0,need).toFixed(2)+'. You are defending strong ground, not chasing a mirage.</div>';
  }
  h+='</div>';
  $('d-res').innerHTML=h;
}
</script>
<script>
// Only force lecturer mode if the app is actually installed as the lecturer PWA
// OR if the user manually visits #lecturer (but don't trap them forever)
if(location.hash==='#lecturer'){
  localStorage.setItem('as_lec_session','1'); // Session-only flag
}
const isLecSession=localStorage.getItem('as_lec_session')==='1';
if(isLecSession&&!location.hash){
  // Only redirect if we're in the same session (tab not closed)
  // Once they close the tab, the trap resets
  location.hash='#lecturer';
}
// Clear the session flag when they explicitly go to student mode
if(location.hash===''||location.hash==='#'){
  localStorage.removeItem('as_lec_session');
}
</script>
