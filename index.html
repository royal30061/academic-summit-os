(function(){
  var dbg=function(m){if(document.getElementById('dbg'))return;var d=document.createElement('pre');d.id='dbg';d.style.cssText='position:fixed;z-index:99999;top:0;left:0;right:0;background:#7f1d1d;color:#fff;font:12px monospace;padding:10px;white-space:pre-wrap;margin:0';d.textContent='ERROR: '+m;document.documentElement.appendChild(d);};
  window.addEventListener('error',function(e){dbg(e.message+' (line '+e.lineno+')');});

<style>
/* ---------- Theme tokens (light = silver, dark = deep green) ---------- */
:root{--bg:#e6eaee;--card:#fafbfc;--sub:#eef1f4;--bd:#cdd4db;--tx:#0e1217;--mut:#56616b;--sh:0 1px 0 rgba(255,255,255,.95) inset,0 12px 26px -16px rgba(12,18,26,.45)}

/* ---------- Base ---------- */
body{background:linear-gradient(180deg,#d9dfe5 0%,#eef1f4 38%,#e2e7ec 100%) fixed;color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
html.dark body{background:#02120c;color:#e7fff5}
html.dark #main{color:#e7fff5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1.25rem;box-shadow:var(--sh);backdrop-filter:blur(10px)}
:root:not(.dark) .card{background:linear-gradient(180deg,#fff,#f0f3f6)}
html.dark .card{backdrop-filter:none}
.grad{color:#fff}
.grad,.btn{background:linear-gradient(135deg,#059669,#10b981 55%,#06b6d4)!important;box-shadow:0 8px 20px -8px rgba(16,185,129,.5)}
.dark .grad,.dark .btn{box-shadow:0 0 18px rgba(16,185,129,.35)}
.btn{color:#fff;font-weight:700;font-size:.82rem;padding:.7rem 1.1rem;border-radius:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;cursor:pointer}
.btn2{background:rgba(16,185,129,.12)!important;color:#047857!important;font-weight:700;font-size:.82rem;padding:.6rem 1rem;border-radius:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;cursor:pointer}
.dark .btn2{color:#6ee7b7!important}
.dark .btn2.\!text-rose-500{color:#fb7185!important}
.inp{width:100%;padding:.7rem .9rem;border-radius:.9rem;border:1px solid var(--bd);font-size:.85rem;background:var(--card);color:var(--tx)}
.inp:focus{outline:none;border-color:#059669;box-shadow:0 0 0 3px rgba(16,185,129,.15)}
html.dark .inp{background:#0b3527;color:#e7fff5;border-color:#0d3f2e}
.lbl{font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.nav-on{background:linear-gradient(135deg,#059669,#6366f1)!important;color:#fff!important}
.donut{border-radius:50%;display:grid;place-items:center}
.donut>div{background:var(--card);border-radius:50%;display:grid;place-items:center}
html.dark .donut>div{background:#07271d;color:#e7fff5}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#8b8bb0;border-radius:3px}

/* ---------- Toasts ---------- */
#toast-container{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{pointer-events:auto;animation:slideIn .3s cubic-bezier(.16,1,.3,1) forwards}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ---------- Light (silver) chrome ---------- */
:root:not(.dark) .bg-slate-50{background-color:#e9edf1!important}
:root:not(.dark) .inp{background:#fff;border-color:#c3ccd4;box-shadow:inset 0 1px 2px rgba(12,18,26,.07)}
:root:not(.dark) .btn2{background:linear-gradient(180deg,#f8fafb,#dde3e8)!important;color:#1b2530!important;border:1px solid #c3ccd4;box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
:root:not(.dark) .btn2.\!text-rose-500{color:#e11d48!important}

:root:not(.dark) #top .text-slate-500,:root:not(.dark) #top .text-slate-400{color:#98a3af!important}
:root:not(.dark) #top .text-sm.font-extrabold{background:linear-gradient(180deg,#fff 0%,#d3dae0 45%,#8f9aa6 52%,#eef2f5 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:1.05rem;letter-spacing:.01em}
:root:not(.dark) #top button{border-color:#313a43!important}
:root:not(.dark) #top button:first-child{background:#1c2229!important;color:#e6ebf0}
:root:not(.dark) #side{background:linear-gradient(180deg,#12161b,#040506)!important}
:root:not(.dark) #bnav{background:linear-gradient(180deg,#171c22,#06080b)!important;border-top:1px solid #2a323a!important}
:root:not(.dark) #bnav .bn{color:#9ca7b2!important}
:root:not(.dark) #bnav .bn[class*="text-violet"]{color:#34d399!important}

/* ---------- Dark chrome ---------- */
#side{background:#021812!important}
.dark #top{background:rgba(7,39,29,.9)!important;color:#e7fff5}
html.dark #top button{color:#e7fff5}
html.dark #top .text-sm.font-extrabold{background:none;color:#fff;-webkit-text-fill-color:#fff}

/* ---------- Brand colour overrides ---------- */
[class*="text-violet"]{color:#047857!important}

/* ---------- Toggle switch ---------- */

.sw::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}

@media print{aside,nav,header,.np,#toast-container{display:none!important}body{background:#fff!important;color:#000!important}.card{box-shadow:none!important;border:1px solid #ccc!important}}

<script>
/* =====================================================================
   Academic Summit - single consolidated script (Parser Fixed)
   ===================================================================== */

// ---------- Config ----------
const SB_URL='https://okajzlkeaydskdvogdaw.supabase.co';
const SB_KEY='sb_publishable_xqUBfEtWElgUkKAz65bueg_66AkIHtr';
const RECOVERY=/type=recovery/.test(location.hash);
const sb=supabase.createClient(SB_URL,SB_KEY);
const LEC_LINK=location.hash==='#lecturer'||/[?&]lecturer=1/.test(location.search);

// ---------- Helpers ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira=n=>'₦'+Math.round(n||0).toLocaleString();
const days=d=>Math.ceil((new Date(d)-new Date().setHours(0,0,0,0))/864e5);
const fmtD=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const iso=d=>d.toISOString().slice(0,10);
const leftTxt=dt=>{if(!dt)return'';const ms=new Date(dt)-Date.now();if(ms<0)return'overdue';const m=Math.floor(ms/60000),h=Math.floor(m/60),d=Math.floor(h/24);return d?d+'d '+(h%24)+'h':h?h+'h '+(m%60)+'m':m+'m';};
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night';};
const track=(name,props)=>{try{if(window.posthog)posthog.capture(name,props);}catch(e){}};
const chip=(txt,col)=>'<span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-'+col+'-100 dark:bg-'+col+'-950 text-'+col+'-600 dark:text-'+col+'-300">'+txt+'</span>';
function MTN(c){return '<svg class="'+(c||'w-10 h-10')+'" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M2 54 24 16l12 20 6-9 20 27z" fill="#10b981"/><path d="M26 54 42 27l20 27z" fill="#047857"/><path d="M24 16l6 10-4-2-2 4-4-4-1.5 1.5z" fill="#ecfdf5"/></svg>';}

// ---------- Icons ----------
const IC={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1z"/>',
acad:'<path d="M12 3l10 5-10 5L2 8z"/><path d="M6 10v5c0 2 3 3 6 3s6-1 6-3v-5"/>',
plan:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
fin:'<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
mat:'<path d="M4 19V5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M8 7h7"/>',
att:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2h11"/>',
goal:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
car:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/>',
prof:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4 4l2 2m12 12l2 2M20 4l-2 2M6 18l-2 2"/>',
moon:'<path d="M21 13A9 9 0 1111 3a7 7 0 0010 10"/>',
l:'<path d="M15 6l-6 6 6 6"/>',r:'<path d="M9 6l6 6-6 6"/>',
up:'<path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 20h16"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
print:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>'
};
const SI={
pencil:'<path d="M4 20l4-1L20 7l-3-3L5 16z"/>',
bell:'<path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 004 0"/>',
head:'<path d="M4 13a8 8 0 0116 0"/><rect x="3" y="13" width="4" height="6" rx="2"/><rect x="17" y="13" width="4" height="6" rx="2"/>',
shield:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/>',
help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 0c0 2-2.5 2-2.5 4"/><path d="M12 17h.01"/>',
moon:IC.moon,
back:'<path d="M19 12H5m7-7l-7 7 7 7"/>',
mega:'<path d="M3 11l14-5v12L3 13z"/><path d="M7 13v4a2 2 0 002 2h1"/>'
};
const PI={
user:'<path d="M8 8a4 4 0 118 0 4 4 0 01-8 0"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
id:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h4M7 14h6"/><circle cx="16" cy="12" r="2"/>',
dept:'<circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M8 7l8 4M8 17l8-4"/>',
fac:'<path d="M3 21h18M6 21V8l6-4 6 4v13"/><path d="M10 21v-4h4v4"/>',
lvl:'<path d="M4 19V5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/>',
mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
phone:'<path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>'
};
const svg=(paths,cls)=>'<svg class="'+cls+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">'+paths+'</svg>';
const ic=(n,c='w-4 h-4')=>svg(IC[n],c);
const si=n=>svg(SI[n],'w-4 h-4 text-violet-600 dark:text-violet-400');
const pi=n=>svg(PI[n],'w-4 h-4 shrink-0 text-emerald-600 dark:text-emerald-400');

// ---------- State ----------
let DB={users:{}};
try{DB=JSON.parse(localStorage.getItem('as_v8'))||DB;}catch(e){}
let U=null,email='',uid='',view='home',aTab='calc',pTab='month',editing=null;
let cloudReady=false,syncT=null,rosterRows=[];
let calY=new Date().getFullYear(),calM=new Date().getMonth(),selDay=iso(new Date());
let rowN=0,pendingMatric='',resetUser=null,pinUser=null,tourI=0,ltI=0,faqOpen=-1;
const newUser=(name,role='student')=>({name,role,profile:null,target:4.5,semesters:[],tasks:[],events:[],tx:[],fees:{total:0,paid:0,due:''},materials:[],attendance:[],goals:[],career:[]});

// ---------- Theme ----------
let themeMode=localStorage.getItem('as_theme_mode')||(localStorage.getItem('as_theme')==='dark'?'dark':'light');
let isDark=false;
function applyTheme(){
  isDark=themeMode==='system'?matchMedia('(prefers-color-scheme: dark)').matches:themeMode==='dark';
  document.documentElement.classList.toggle('dark',isDark);
}
function setThemeMode(m){themeMode=m;localStorage.setItem('as_theme_mode',m);applyTheme();if(U)start();}
function toggleTheme(){setThemeMode(isDark?'light':'dark');}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(themeMode==='system'){applyTheme();if(U)start();}});
applyTheme();

// ---------- Persistence / cloud sync ----------
async function syncNow(){
  clearTimeout(syncT);syncT=null;
  if(!cloudReady||!uid||!U)return;
  const{error}=await sb.from('user_data').upsert({id:uid,data:U,updated_at:new Date().toISOString()});
  if(error)console.warn('sync failed',error.message);
}
const save=()=>{
  try{if(U)U.updatedAt=Date.now();localStorage.setItem('as_v8',JSON.stringify(DB));}
  catch(e){showToast('Failed to save','error');}
  if(cloudReady){clearTimeout(syncT);syncT=setTimeout(syncNow,1500);}
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')syncNow();});

function showToast(msg,type){
  if(((U&&U.prefs)||{}).inapp===false)return;
  type=type||'success';
  const t=document.createElement('div');
  const bg=type==='success'?'bg-emerald-600 text-white':type==='error'?'bg-rose-600 text-white':'bg-slate-800 text-white';
  t.className='toast px-4 py-3 rounded-xl shadow-lg font-semibold text-xs '+bg;
  t.innerHTML=esc(msg);
  $('toast-container').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),200);},3000);
}

// ---------- Splash ----------
let splashDone=false,splashPct=0,tagI=0;
const TAGS=['Academic success, within reach.','Your summit starts here.','Every grade. One climb.','Climb smart. Rise fast.'];
const tagT=setInterval(()=>{tagI=(tagI+1)%TAGS.length;const el=$('splash-tag');if(el)el.textContent=TAGS[tagI];},1100);
const fillT=setInterval(()=>{
  const b=$('splash-bar');
  if(!b||splashDone)return clearInterval(fillT);
  if(splashPct<90){splashPct+=(90-splashPct)*.07+.5;b.style.width=Math.min(90,splashPct).toFixed(1)+'%';}
},120);
function hideSplash(){
  if(splashDone)return;splashDone=true;
  const b=$('splash-bar');if(b)b.style.width='100%';
  setTimeout(()=>{clearInterval(tagT);clearInterval(fillT);const s=$('splash');if(s){s.style.transition='opacity .35s';s.style.opacity='0';setTimeout(()=>s.remove(),400);}},350);
}
setTimeout(hideSplash,4000);

// ---------- Academic engine ----------
const gr=s=>{s=parseFloat(s);if(isNaN(s))return['-',0];return s>=70?['A',5]:s>=60?['B',4]:s>=50?['C',3]:s>=45?['D',2]:s>=40?['E',1]:['F',0];};
const semS=s=>{let u=0,q=0;if(!s||!s.courses)return{u:0,q:0,g:0};s.courses.forEach(c=>{u+=+c.unit;q+=c.unit*gr(c.score)[1];});return{u,q,g:u?q/u:0};};
const cum=()=>{let u=0,q=0;if(!U||!U.semesters)return{u:0,q:0,g:0};U.semesters.forEach(s=>{(s.courses||[]).forEach(c=>{if(c.sup)return;u+=+c.unit;q+=c.unit*gr(c.score)[1];});});return{u,q,g:u?q/u:0};};
const requiredAvg=()=>{const c=cum(),tot=U?.profile?.totalUnits||120,R=tot-c.u;return R>0?(U.target*tot-c.q)/R:null;};
const semPrint=s=>(s.name||'')+'|'+(s.courses||[]).map(c=>c.code+':'+c.unit+':'+c.score).sort().join(',');
function dedupeSems(){
  const seen={},keep=[];
  (U.semesters||[]).forEach(s=>{const k=semPrint(s);if(!seen[k]){seen[k]=1;keep.push(s);}});
  const removed=(U.semesters||[]).length-keep.length;
  U.semesters=keep;return removed;
}
function scanCarryovers(){
  const all=[],by={},owed=[];
  U.semesters.forEach((s,si)=>(s.courses||[]).forEach((c,ci)=>all.push({si,ci,code:c.code,score:c.score,unit:c.unit})));
  U.semesters.forEach(s=>(s.courses||[]).forEach(c=>{delete c.sup;}));
  all.forEach(a=>(by[a.code]=by[a.code]||[]).push(a));
  Object.keys(by).forEach(code=>{
    const list=by[code];
    list.forEach(a=>{
      if(gr(a.score)[1]!==0)return;
      const later=list.find(b=>b.si>a.si&&gr(b.score)[1]>0);
      if(later)U.semesters[a.si].courses[a.ci].sup=true;
      else owed.push({code,unit:a.unit,score:a.score,sem:U.semesters[a.si].name});
    });
  });
  return owed;
}
function refreshCarry(){if(!U||!U.semesters)return;U.carry=scanCarryovers();save();}

function goalStatus(g){
  const m=g.title.match(/(\d\.\d{1,2})/);
  if(!m)return g.done?['Done','emerald']:['Active','slate'];
  const t=+m[1],c=cum().g;
  if(c>=t){if(!g.done){g.done=true;save();}return['Achieved','emerald'];}
  return[c>=t-0.5?'On track':'Behind','violet'];
}

// ---------- Boot ----------
async function boot(user){
  hideSplash();
  try{
    uid=user.id;email=user.email;
    const{data:p}=await sb.from('profiles').select('role').eq('id',uid).maybeSingle();
    const role=p?.role||'student';
    if(LEC_LINK&&role!=='lecturer')return pinGate(user);
    U=DB.users[email]||(DB.users[email]=newUser(user.user_metadata?.name||email,role));
    cloudReady=false;
    try{
      const{data:row,error:ce}=await sb.from('user_data').select('data').eq('id',uid).maybeSingle();
      if(ce)throw ce;
      if(row&&row.data&&(row.data.updatedAt||0)>(U.updatedAt||0)){DB.users[email]=row.data;U=row.data;}
      cloudReady=true;
    }catch(e){showToast('Cloud sync unavailable - working offline','error');}
    U.role=role;
    ['materials','attendance','goals','career','tasks','events','tx','semesters'].forEach(k=>{if(!U[k])U[k]=[];});
    if(!U.fees)U.fees={total:0,paid:0,due:''};
    const dupes=dedupeSems();
    if(dupes)showToast('Cleaned '+dupes+' duplicate semester(s)');
    refreshCarry();
    if(!U.profile&&role==='lecturer'){U.profile={uni:'',level:'',program:'',faculty:'',totalUnits:0,matric:'',phone:'',semail:''};save();}
    if(!U.profile)return authOnboard();
    start();
  }catch(e){console.error(e);showRecover(e);}
}

// ---------- Planner helpers ----------
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const dow=ds=>(new Date(ds+'T00:00:00').getDay()+6)%7;
const addDays=(ds,n)=>{const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);};
const weekStart=ds=>addDays(ds,-dow(ds));
const ttLive=ds=>!U.ttEnd||ds<=U.ttEnd;
const NOTHING='<p class="text-xs text-slate-400">Nothing this day.</p>';
function planMonth(){
  const first=new Date(calY,calM,1),startDow=(first.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate();
  const mName=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const dayHas=ds=>U.events.some(e=>e.date===ds)||U.tasks.some(t=>(t.end||t.start||'').slice(0,10)===ds)||(U.timetable||[]).some(t=>t.day===dow(ds)&&ttLive(ds));
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div></div>';
  for(let d=1;d<=dim;d++){
    const ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    cells+='<button onclick="selDay=\''+ds+'\';go(\'plan\')" class="aspect-square rounded-xl flex flex-col items-center justify-center gap-1 text-xs font-semibold '+(ds===selDay?'grad text-white':'bg-slate-50 dark:bg-slate-800/40')+' '+(ds===iso(new Date())?'ring-2 ring-emerald-400':'')+'">'+d+(dayHas(ds)?'<span class="w-1 h-1 rounded-full '+(ds===selDay?'bg-white':'bg-emerald-500')+'"></span>':'')+'</button>';
  }
  const dEv=U.events.filter(e=>e.date===selDay);
  const dTk=U.tasks.filter(t=>(t.end||t.start||'').slice(0,10)===selDay);
  const dTt=(U.timetable||[]).filter(t=>t.day===dow(selDay)&&ttLive(selDay));
  const sched=dTt.map(t=>'<div class="text-xs p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40"><b>'+esc(t.code)+'</b><div class="text-slate-500">Class • '+t.start+'–'+t.end+' • '+esc(t.venue||'TBA')+'</div></div>').join('')+
    dEv.map(e=>'<div class="text-xs p-3 rounded-xl bg-slate-50 dark:bg-slate-800/40"><b>'+esc(e.title)+'</b><div class="text-slate-500">'+esc(e.type)+'</div></div>').join('')+
    dTk.map(t=>'<div class="text-xs p-3 rounded-xl bg-slate-50 dark:bg-slate-800/40"><b>'+esc(t.t)+'</b><div class="text-slate-500">Task</div></div>').join('');
  return '<div class="card p-5 space-y-3"><div class="flex justify-between items-center"><button class="btn2 px-2" onclick="calM--;if(calM<0){calM=11;calY--;}go(\'plan\')">'+ic('l')+'</button><div class="font-extrabold">'+mName+'</div><button class="btn2 px-2" onclick="calM++;if(calM>11){calM=0;calY++;}go(\'plan\')">'+ic('r')+'</button></div><div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400">'+['M','T','W','T','F','S','S'].map(d=>'<div>'+d+'</div>').join('')+'</div><div class="grid grid-cols-7 gap-1">'+cells+'</div></div>'+
  '<div class="card p-5 space-y-3"><div class="font-extrabold">'+fmtD(selDay)+' — Schedule</div>'+(sched||NOTHING)+
  '<div class="space-y-2 pt-2 border-t border-slate-100 dark:border-slate-800"><div class="lbl">Add event on this day</div><div class="flex gap-2"><input id="e-t" class="inp" placeholder="Title"><select id="e-k" class="inp"><option>Exam</option><option>Test</option><option>Assignment</option><option>Lecture</option></select></div><button class="btn w-full" onclick="addEvent()">Schedule Event</button></div></div>';
}
function planWeek(){
  const ws=weekStart(selDay);
  const week=DAYS.map((d,i)=>{
    const ds=addDays(ws,i);
    const items=(U.timetable||[]).filter(t=>t.day===i&&ttLive(ds)).sort((a,b)=>a.start<b.start?-1:1);
    const evs=U.events.filter(e=>e.date===ds);
    const body=(items.length||evs.length)?items.map(t=>'<div class="text-xs flex justify-between"><b>'+esc(t.code)+'</b><span>'+t.start+'–'+t.end+' • '+esc(t.venue||'TBA')+'</span></div>').join('')+evs.map(e=>'<div class="text-xs flex justify-between"><b>'+esc(e.title)+'</b><span>'+esc(e.type)+'</span></div>').join(''):'<div class="text-[11px] text-slate-400">Free day</div>';
    return '<div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/40 space-y-1"><div class="flex justify-between text-xs font-extrabold"><span>'+d+'</span><span class="text-slate-400">'+fmtD(ds)+'</span></div>'+body+'</div>';

  '<div class="space-y-2 pt-2 border-t border-slate-100 dark:border-slate-800"><div class="lbl">Add class slot</div><div class="grid grid-cols-2 gap-2"><select id="tt-d" class="inp">'+DAYS.map((d,i)=>'<option value="'+i+'">'+d+'</option>').join('')+'</select><input id="tt-c" class="inp uppercase font-mono" placeholder="Course code"></div><div class="grid grid-cols-3 gap-2"><input id="tt-v" class="inp" placeholder="Venue"><input id="tt-s" type="time" class="inp"><input id="tt-e" type="time" class="inp"></div><button class="btn w-full" onclick="addTT()">Add to timetable</button><div class="lbl pt-2">Repeat until (exam week starts)</div><input type="date" class="inp" value="'+esc(U.ttEnd||'')+'" onchange="U.ttEnd=this.value;save();go(\'plan\')"></div><div class="space-y-1 pt-2">'+slots+'</div></div>';

// FIXED TROJAN HORSE PARSER (Filters out stray serial index numbers <= 15)
function parsePasteTrojan(){
  const raw=$('paste-a').value||'';
  if(!raw.trim())return showToast('Paste portal text first','error');
  const merged=raw.replace(/([A-Z]{2,4})[ \t]+(\d{3}[A-Z]?)\b/g,'$1$2');
  const tokens=merged.split(/[\s,;|]+/).map(t=>t.trim()).filter(Boolean);
  const codeRe=/^[A-Z]{2,4}(?:-[A-Z]{2,6})?\d{3}[A-Z]?$/;
  const scan=strict=>{
    const out=[],seen={},noScore={};
    for(let i=0;i<tokens.length;i++){
      const tk=tokens[i];
      if(!codeRe.test(tk))continue;
      let unit=null,score=null;
      for(let j=i+1;j<Math.min(tokens.length,i+18);j++){
        const t=tokens[j];
        if(codeRe.test(t))break;
        if(unit===null&&/^\d{1,2}$/.test(t)){const n=+t;if(n>=1&&n<=6)unit=n;continue;}
        if(unit!==null&&/^\d{1,3}(\.\d+)?$/.test(t)){
          const s=+t;
          if(s>100)continue;
          if(strict){if(/^[A-F]$/.test(tokens[j+1]||'')){score=s;break;}}
          else{score=s;break;}
        }
      }
      if(!strict&&score!==null&&score<=15&&/^\d{1,2}$/.test(tokens[i-1]||''))score=null;
      const code=tk.replace(/^UA-/,'');
      if(unit===null)continue;
      if(score===null){noScore[code]=1;continue;}
      if(seen[code])continue;
      seen[code]=1;out.push([code,unit,score]);
    }
    return{out,noScore,seen};
  };
  let r=scan(true),lenient=false;
  if(!r.out.length){r=scan(false);lenient=true;}
  const out=r.out;
  if(!out.length)return showToast('No course pattern found - paste the full results page, or add courses manually below','error');
  const missing=Object.keys(r.noScore).filter(c=>!r.seen[c]);
  $('rows').innerHTML='';rowN=0;
  out.forEach(o=>addRow(...o));
  $('paste').classList.add('hidden');
  showToast(out.length+' courses parsed'+(missing.length?' - no result yet for '+missing.slice(0,4).join(', '):'')+(lenient?' - no grade letters found, check every score':'')+' - review & save');
  const mm=raw.match(/\b(\d{2}\/[A-Z0-9]{2,8}\/[A-Z0-9]{2,8})\b/i)||raw.match(/\b(20\d{2}\/?\d{6,7})\b/);
  if(mm){const m=mm[0].toUpperCase();if(m!==U.profile.matric)askMatric(m);}
}

function saveSem(){
  const courses=[];
  document.querySelectorAll('#rows > div').forEach(r=>{
    const code=r.querySelector('.c-code').value.trim().toUpperCase();
    const unit=parseFloat(r.querySelector('.c-unit').value);
    const sc=r.querySelector('.c-score').value;
    if(code&&unit>=1&&unit<=6&&sc!==''&&+sc>=0&&+sc<=100)courses.push({code,unit,score:+sc});
  });
  if(!courses.length)return showToast('Enter at least one valid course with score (0-100)','error');
  const name=$('c-name').value.trim()||('Semester '+(U.semesters.length+1));
  const finish=msg=>{refreshCarry();go('home');showToast(msg);rwDone();};

  if(editing!==null){
    const s=U.semesters.find(x=>x.id===editing);
    s.name=name;s.courses=courses;editing=null;
    return finish('Updated! GPA '+semS(s).g.toFixed(2)+' | CGPA '+cum().g.toFixed(2));
  }
  if(U.semesters.some(s=>semPrint(s)===semPrint({name,courses})))return showToast('Already recorded - duplicate blocked','error');

  const codes=courses.map(c=>c.code);
  const match=U.semesters.find(s=>{
    const sc=(s.courses||[]).map(c=>c.code);
    return codes.filter(c=>sc.indexOf(c)>-1).length/codes.length>=0.6;
  });
  if(match){
    const before=cum().g;
    let upd=0,add=0;
    courses.forEach(c=>{
      const ex=match.courses.find(x=>x.code===c.code);
      if(ex){if(ex.score!==c.score||ex.unit!==c.unit){ex.score=c.score;ex.unit=c.unit;upd++;}}
      else{match.courses.push(c);add++;}
    });
    save();refreshCarry();
    const after=cum().g;
    (U.cgpaLog=U.cgpaLog||[]).push({t:Date.now(),g:after,d:after-before});
    save();
    track('semester_merged',{updated:upd,added:add});
    return finish('Merged: '+upd+' updated, '+add+' added. CGPA '+after.toFixed(2)+' ('+(after-before>=0?'+':'')+(after-before).toFixed(2)+')');
  }
  const sameName=U.semesters.find(s=>(s.name||'')===name);
  if(sameName){
    if(!confirm(name+' exists with different results. Replace it?'))return;
    sameName.courses=courses;
  }else U.semesters.push({id:Date.now(),name,courses});
  save();
  finish('Saved! Semester GPA: '+semS({courses}).g.toFixed(2)+' | New CGPA: '+cum().g.toFixed(2));
}

// ---------- Menu of Decimals ----------
function parseReg(t){
  const L=String(t).split('\n').map(x=>x.trim()).filter(Boolean);
  const out=[[],[]];let sem=0;
  const full=/^(?:\d{1,2} )?((?:UA-)?[A-Z]{2,4}\d{3}[A-Z]?) .*?\b([1-6]) ([CE])$/i;
  const lone=/^(?:\d{1,2} )?((?:UA-)?[A-Z]{2,4}\d{3}[A-Z]?)$/i;
  const add=(code,u,st)=>{
    const c=code.toUpperCase().replace(/^UA-/,'');
    if(!out[sem].some(r=>r.code===c))out[sem].push({code:c,unit:+u,st:st.toUpperCase()});
  };
  for(let i=0;i<L.length;i++){
    const ln=L[i].replace(/\s+/g,' ');
    if(/^total/i.test(ln)){if(out[sem].length&&sem<1)sem=1;continue;}
    let m=ln.match(full);
    if(m){add(m[1],m[2],m[3]);continue;}
    m=ln.match(lone);
    if(m){
      for(let k=1;k<=4;k++){
        if(/^[1-6]$/.test(L[i+k]||'')&&/^[CE]$/i.test(L[i+k+1]||'')){add(m[1],L[i+k],L[i+k+1]);i+=k+1;break;}
      }
    }
  }
  return out;
}
function decCalc(D){
  const a=D[0].reduce((x,r)=>x+r.unit,0),b=D[1].reduce((x,r)=>x+r.unit,0);
  return{u:[a,b],den:(a&&b)?a+b:2*(a||b)};
}

    return '<div class="space-y-2"><div class="flex justify-between text-xs"><b>'+name+'</b><span class="text-slate-400">'+K.u[si]+' units</span></div><div class="overflow-x-auto"><table class="w-full text-[11px] text-left font-mono"><thead class="text-slate-400">'+head+'</thead><tbody>'+rows+tot+'</tbody></table></div></div>';
  };

// ---------- Lecturer: live OTP session ----------
const liveKey=()=>'as_live_'+uid;
const liveGet=()=>{try{return JSON.parse(localStorage.getItem(liveKey()));}catch(e){return null;}};
const liveSet=s=>{try{localStorage.setItem(liveKey(),JSON.stringify(s));}catch(e){}};
let liveTick=null,livePoll=null;
function liveStop(){clearInterval(liveTick);clearInterval(livePoll);liveTick=livePoll=null;}
function livePaint(){
  const s=liveGet(),o=$('otp-display'),t=$('timer-display');
  if(!s||!o||!t)return;
  const left=Math.max(0,Math.round((s.end-Date.now())/1000));
  o.textContent=left?s.code:'EXPIRED';
  t.textContent=left?'Expires in '+left+'s':'Session closed';
  const c=$('sub-count');if(c)c.textContent=(s.count||0)+' Present';
}
async function livePollOnce(){
  const s=liveGet();if(!s)return;
  try{
    const r=await sb.from('attendance').select('id',{count:'exact',head:true}).eq('session_id',s.id);
    const n=liveGet();if(n&&n.id===s.id){n.count=r.count||0;liveSet(n);}
  }catch(e){}
  livePaint();
  if(Date.now()>s.end+5000)liveStop();
}
function liveRun(){
  liveStop();livePaint();livePollOnce();
  liveTick=setInterval(()=>{if(!liveGet())return liveStop();livePaint();},1000);
  livePoll=setInterval(livePollOnce,3000);
}
function liveRestore(){
  const s=liveGet();if(!s)return;
  if(Date.now()>s.end+120000){localStorage.removeItem(liveKey());return;}
  const put=(id,v)=>{
    const e=$(id);if(!e||!v)return;
    if(e.tagName==='SELECT'){if(Array.from(e.options).some(o=>o.value===v))e.value=v;}else e.value=v;
  };
  put('lec-course',s.course);put('lec-topic',s.topic);put('lec-level',s.level);
  const lp=$('live-panel');if(lp)lp.classList.remove('hidden');
  liveRun();
}
async function startAttendanceSession(){
  const course=$('lec-course').value.trim()||'POS 204',topic=$('lec-topic').value.trim(),level=($('lec-level')||{}).value||'';
  const{data,error}=await sb.rpc('start_session',{p_course:course,p_topic:topic});
  if(error)return showToast(error.message,'error');
  const s=data[0];
  liveSet({id:s.s_id,code:s.s_code,end:new Date(s.s_expires).getTime(),course,topic,level,count:0});
  $('live-panel').classList.remove('hidden');
  liveRun();
}
async function reissueCode(){
  const s=liveGet();
  if(!s)return showToast('Generate a session first','error');
  const{data,error}=await sb.rpc('reissue_session',{p_session_id:s.id});
  if(error)return showToast(error.message,'error');
  const n=data[0];

  showToast('New code broadcast - SAME class list');

function semProfile(courses){
  const cnt={A:0,B:0,C:0,D:0,E:0,F:0};
  (courses||[]).forEach(function(c){const g=gr(c.score)[0];if(cnt[g]!==undefined)cnt[g]++;});
  const order=['A','B','C','D','E','F'];
  const total=(courses||[]).length||1;
  const modal=order.reduce(function(m,g){return cnt[g]>cnt[m]?g:m;},'A');
  const carry=cnt.F||0;
  const split=(carry>=Math.ceil(total/2)&&(cnt.A+cnt.B)>=1);

  return{cnt:cnt,modal:modal,carry:carry,split:split,label:label,total:total};
}

function runDet(){

<script>
const DEPT_FAC={};
Object.keys(SEED).forEach(function(f){SEED[f].forEach(function(d){DEPT_FAC[d]=f;});});
const PREFIX_DEPT={POS:'Political Science',POL:'Political Science',ENL:'English Language',ENG:'English Language',LIN:'English Language',CSC:'Computer Science',MTH:'Mathematics',PHY:'Physics',CHM:'Chemistry',BIO:'Biology',MCB:'Microbiology',BCH:'Biochemistry',STA:'Statistics',ECO:'Economics',SOC:'Sociology',PSY:'Psychology',GEO:'Geography',IRL:'International Relations',MAC:'Mass Communication',MCM:'Mass Communication',ACC:'Accounting',BFN:'Banking & Finance',BUS:'Business Administration',MKT:'Marketing',ACT:'Actuarial Science',LAW:'Common Law',ARC:'Architecture',BLD:'Building Technology',EST:'Estate Management',QS:'Quantity Surveying',URP:'Urban & Regional Planning',MED:'Medicine & Surgery',NUR:'Nursing Science',PHA:'Pharmacy',MLS:'Medical Laboratory Science',PBH:'Public Health',ANS:'Animal Science',CRP:'Crop Science',AEC:'Agricultural Economics',SOIL:'Soil Science',ADE:'Adult Education',EDM:'Educational Management',HK:'Human Kinetics',ECE:'Early Childhood Education',HIS:'History',PHI:'Philosophy',THE:'Theatre Arts',FRE:'French',ARB:'Arabic Studies'};
const SERVICE={GST:1,GNS:1,UA:1};
function extractPortalInfo(raw){
  const g=function(re){const m=(raw||'').match(re);return m?m[1].trim():'';};
  return{name:g(/Name:\s*([A-Za-z][A-Za-z .'-]*)/i),fac:g(/Faculty:\s*([A-Za-z][A-Za-z &'-]*)/i),dept:g(/Department:\s*([A-Za-z][A-Za-z &'-]*)/i),level:g(/Current Level:\s*(\d{3})/i)};
}
function inferDeptFromCourses(courses){
  const cnt={};
  (courses||[]).forEach(function(c){
    const p=(String(c.code).match(/^([A-Z]{2,4})/)||[])[1];
    if(!p||SERVICE[p])return;
    cnt[p]=(cnt[p]||0)+1;
  });
  const top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];})[0];
  return top?(PREFIX_DEPT[top]||''):'';
}
function reconcileProfile(courses,raw){
  if(!U||!U.profile)return;
  const info=extractPortalInfo(raw||'');
  let changed=false;
  let dept=info.dept||inferDeptFromCourses(courses);
  dept=dept?normDept(dept):'';
  if(dept&&dept!==U.profile.program){U.profile.program=dept;changed=true;}
  let fac=info.fac||(dept?DEPT_FAC[dept]:'');
  if(fac&&fac!==U.profile.faculty){U.profile.faculty=fac;changed=true;}
  if(info.name&&info.name!==U.name){U.name=info.name;changed=true;}
  const len=(U.semesters||[]).length;
  const inferred=100+Math.floor(len/2)*100;
  const lvl=parseInt(info.level)||Math.max(inferred,parseInt(U.profile.level)||100);
  if(lvl&&String(lvl)!==String(U.profile.level)){U.profile.level=String(lvl);changed=true;}
  if(changed){
    save();
    sb.from('profiles').update({faculty:U.profile.faculty,program:U.profile.program,level:U.profile.level,name:U.name}).eq('id',uid).then(()=>{});
    if(U.profile.faculty&&U.profile.program)bumpDept(U.profile.faculty,U.profile.program);
    start();
    showToast('Profile updated to match your uploaded result');
  }
}
