            --border-color: rgba(255, 255, 255, 0.08);

            font-family: 'Plus Jakarta Sans', sans-serif;

            -webkit-backdrop-filter: blur(16px);

            -webkit-backdrop-filter: blur(20px);

    <script>
        // =========================================================================
        // 1. THE SINGLE AUTHORITATIVE ACADEMIC ENGINE
        // =========================================================================
        // COURSE -> Units + Score -> Grade + Grade Point -> Quality Points
        // -> Semester GPA -> Semester Units -> Cumulative Quality Points + Units -> CGPA
        // =========================================================================

        const AcademicEngine = {
            GRADE_MAP: [
                { min: 70, max: 100, letter: 'A', gp: 5 },
                { min: 60, max: 69,  letter: 'B', gp: 4 },
                { min: 50, max: 59,  letter: 'C', gp: 3 },
                { min: 45, max: 49,  letter: 'D', gp: 2 },
                { min: 40, max: 44,  letter: 'E', gp: 1 },
                { min: 0,  max: 39,  letter: 'F', gp: 0 }
            ],

            /**
             * Pure step 1: Grade & Grade Point resolution from numeric score or letter grade
             */
            resolveGrade(scoreOrLetter) {
                if (typeof scoreOrLetter === 'string') {
                    const clean = scoreOrLetter.trim().toUpperCase();
                    const match = this.GRADE_MAP.find(m => m.letter === clean);
                    if (match) return { letter: match.letter, gp: match.gp };
                }
                const score = parseFloat(scoreOrLetter);
                if (isNaN(score)) return { letter: '-', gp: 0 };
                
                for (const range of this.GRADE_MAP) {
                    if (score >= range.min) return { letter: range.letter, gp: range.gp };
                }
                return { letter: 'F', gp: 0 };
            },

            /**
             * Pure step 2: Single Course Evaluation
             */
            evaluateCourse(course) {
                const units = parseFloat(course.unit || course.units) || 0;
                const score = course.score !== undefined ? parseFloat(course.score) : null;
                const { letter, gp } = this.resolveGrade(score !== null && !isNaN(score) ? score : course.grade);
                const qp = units * gp;

                return {
                    code: (course.code || 'UNKNOWN').toUpperCase().trim(),
                    unit: units,
                    score: score,
                    grade: letter,
                    gp: gp,
                    qp: qp
                };
            },

            /**
             * Pure step 3: Single Semester Evaluation
             */
            evaluateSemester(courses) {
                let semesterUnits = 0;
                let semesterQP = 0;
                const evaluatedCourses = [];

                courses.forEach(c => {
                    const evalC = this.evaluateCourse(c);
                    if (evalC.unit > 0) {
                        evaluatedCourses.push(evalC);
                        semesterUnits += evalC.unit;
                        semesterQP += evalC.qp;
                    }
                });

                const gpa = semesterUnits > 0 ? semesterQP / semesterUnits : 0;

                return {
                    courses: evaluatedCourses,
                    units: semesterUnits,
                    qp: semesterQP,
                    gpa: gpa
                };
            },

            /**
             * Pure step 4: Full Academic Trajectory & Cumulative Engine (CGPA)
             */
            evaluateCumulative(semesters) {
                let cumulativeUnits = 0;
                let cumulativeQP = 0;
                const evaluatedSemesters = [];

                semesters.forEach((sem, idx) => {
                    const evalSem = this.evaluateSemester(sem.courses || []);
                    cumulativeUnits += evalSem.units;
                    cumulativeQP += evalSem.qp;
                    
                    evaluatedSemesters.push({
                        id: sem.id || Date.now() + idx,
                        name: sem.name || `Semester ${idx + 1}`,
                        ...evalSem
                    });
                });

                const cgpa = cumulativeUnits > 0 ? cumulativeQP / cumulativeUnits : 0;

                return {
                    semesters: evaluatedSemesters,
                    cumulativeUnits,
                    cumulativeQP,
                    cgpa
                };
            },

            /**
             * Reverse-engineering engine for Result Detective, strictly bound to engine rules
             */
            detectiveAnalysis(gpa1, targetCGPA, existingCumulativeUnits = 0, existingCumulativeQP = 0, assumedSem2Units = 20) {
                const sem1Units = 20; // Default baseline unit assumption if unknown
                const sem1QP = gpa1 * sem1Units;
                
                // Cumulative equation: (existingQP + sem1QP + sem2QP) / (existingUnits + sem1Units + sem2Units) = targetCGPA
                const totalUnits = existingCumulativeUnits + sem1Units + assumedSem2Units;
                const targetTotalQP = targetCGPA * totalUnits;
                const requiredSem2QP = targetTotalQP - (existingCumulativeQP + sem1QP);
                const requiredSem2GPA = requiredSem2QP / assumedSem2Units;

                return {
                    sem1Units,
                    sem1QP,
                    assumedSem2Units,
                    requiredSem2QP,
                    requiredSem2GPA,
                    isPossible: requiredSem2GPA >= 0 && requiredSem2GPA <= 5.0

            const evalResult = AcademicEngine.evaluateCumulative(currentUser.academic.semesters || []);
            currentUser.academic.cgpa = evalResult.cgpa;
            currentUser.academic.totalUnits = evalResult.cumulativeUnits;
            currentUser.academic.cumulativeQP = evalResult.cumulativeQP;
            
            // Update individual semester calculated attributes
            evalResult.semesters.forEach((s, idx) => {

                    currentUser.academic.semesters[idx].gpa = s.gpa;
                    currentUser.academic.semesters[idx].units = s.units;

            saveDB();

            const name = document.getElementById('su-name').value.trim();

            const pass = document.getElementById('su-pass').value;

            if (!name || !email || !pass) return alert("Please complete all fields.");
            if (DB.users[email]) return alert("Account with this email already exists.");

            DB.users[email] = {
                name, pass, profile: null,
                academic: { semesters: [], cgpa: 0.00, totalUnits: 0, cumulativeQP: 0, targetCGPA: 4.50 },
                planner: { tasks: [], events: [] },
                finance: { semesterBudget: 150000, transactions: [] }
            };
            DB.current = email;
            saveDB();
            showAuthScreen('screen-onboard');
        }

        function handleLogin() {
            const email = document.getElementById('li-email').value.trim().toLowerCase();
            const pass = document.getElementById('li-pass').value;

            if (!DB.users[email] || DB.users[email].pass !== pass) {
                const err = document.getElementById('auth-error');
                err.textContent = "Invalid email address or password.";
                err.classList.remove('hidden-el');
                return;
            }
            DB.current = email;
            saveDB();
            initApp();
        }

            const user = DB.users[DB.current];
            user.profile = {
                uni: document.getElementById('ob-uni').value || 'University of Abuja',

                program: document.getElementById('ob-program').value || 'Political Science & IR',
                totalUnits: parseFloat(document.getElementById('ob-total-units').value) || 160

            saveDB();
            initApp();

            DB.current = null;

            if (!DB.current || !DB.users[DB.current]) return showAuthScreen('screen-welcome');

        function processPaste() {
            const text = document.getElementById('paste-area').value;
            const codes = [...text.matchAll(/\b([A-Z]{2,4}-?[A-Z]{0,3}\d{3})\b/g)].map(m => m[1]);
            const unique = [...new Set(codes)].filter(c => /^[A-Z]/.test(c));

            if (unique.length === 0) return alert("No valid course codes found in pasted text.");

            document.getElementById('calc-rows').innerHTML = '';
            calcRows = 0;
            unique.forEach(code => {
                const idx = text.indexOf(code);
                const snippet = text.substring(idx, idx + 60);
                const unitMatch = snippet.match(/\b([1-6])\b/);
                const scoreMatch = snippet.match(/\b([4-9][0-9]|100)\b/);
                addCalcRow(code, unitMatch ? unitMatch[1] : 3, scoreMatch ? scoreMatch[1] : '');
            });
            togglePasteModal();
        }

                    <div class="glass p-5 rounded-2xl border-l-4 border-brand-cyan">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-black text-brand-cyan uppercase tracking-widest">Engine Grade Distribution Scenarios</span>
                        </div>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mb-3">Predicted grade patterns to reach ${targetPoints.toFixed(0)} QP over 20 units:</p>
                        <div class="flex flex-wrap gap-2">
                            <span class="px-3 py-1 rounded-xl text-xs font-bold text-brand-green bg-brand-green/10">A Grades (5GP): ~${Math.max(0, Math.round((analysis.requiredSem2GPA - 3) * 5))}</span>
                            <span class="px-3 py-1 rounded-xl text-xs font-bold text-brand-blue bg-brand-blue/10">B Grades (4GP): Balance</span>
                        </div>
                    </div>
                `;
            }

            res.innerHTML = html;
        }

        function renderProgressSub() {
            recomputeUserData();
            const sub = document.getElementById('acad-sub-content');
            const totalExpected = currentUser.profile.totalUnits || 160;
            const progressPct = Math.min((currentUser.academic.totalUnits / totalExpected) * 100, 100).toFixed(0);
            
            sub.innerHTML = `
                <div class="glass p-6 md:p-8 rounded-3xl fade-in space-y-6 max-w-4xl">
                    <div>
                        <div class="flex justify-between items-end mb-3">
                            <h3 class="font-extrabold text-lg">${currentUser.profile.program}</h3>
                            <span class="text-sm font-bold text-brand-blue">${progressPct}% Complete</span>
                        </div>
                        <div class="w-full bg-black/10 dark:bg-white/10 rounded-full h-3 overflow-hidden">
                            <div class="progress-bar h-3 rounded-full transition-all duration-1000" style="width: ${progressPct}%"></div>
                        </div>
                        <div class="flex justify-between mt-3 text-xs text-gray-500 dark:text-slate-400">
                            <span>Completed: ${currentUser.academic.totalUnits} units</span>
                            <span>Remaining: ~${totalExpected - currentUser.academic.totalUnits} units</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${['100', '200', '300', '400'].map(level => {
                            const isDone = parseInt(currentUser.profile.level) > parseInt(level);
                            const isCurrent = parseInt(currentUser.profile.level) === parseInt(level);
                            return `
                                <div class="p-4 rounded-2xl border ${isDone ? 'bg-brand-green/5 border-brand-green/20' : isCurrent ? 'bg-brand-blue/5 border-brand-blue/20' : 'bg-black/5 dark:bg-white/5 border-white/5 opacity-60'}">
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm font-bold ${isDone ? 'text-brand-green' : isCurrent ? 'text-brand-blue' : 'text-gray-400'}">${level} Level</span>
                                        <span class="text-[10px] px-2.5 py-1 rounded-full ${isDone ? 'bg-brand-green/20 text-brand-green' : isCurrent ? 'bg-brand-blue/20 text-brand-blue' : 'bg-gray-200 dark:bg-slate-700 text-gray-500'}">
                                            ${isDone ? 'Completed' : isCurrent ? 'In Progress' : 'Locked'}
                                        </span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderHistorySub() {
            recomputeUserData();
            const sub = document.getElementById('acad-sub-content');
            const sems = currentUser.academic.semesters;

            sub.innerHTML = `
                <div class="glass p-6 md:p-8 rounded-3xl fade-in space-y-6 max-w-4xl">
                    <h3 class="font-extrabold text-lg">Academic Semester Records</h3>
                    ${sems.length === 0 ? '<p class="text-xs text-gray-400 text-center py-8">No semesters calculated yet.</p>' : 
                        sems.map(s => `
                            <div class="p-5 rounded-2xl bg-black/5 dark:bg-white/5 border border-gray-200 dark:border-white/5">
                                <div class="flex justify-between items-center mb-3 pb-2 border-b border-gray-200 dark:border-white/5">
                                    <span class="text-xs font-bold">${s.name}</span>
                                    <span class="text-sm font-black text-brand-purple">GPA: ${s.gpa.toFixed(2)} (${s.qp} QP / ${s.units} Units)</span>
                                </div>
                                <div class="space-y-1.5">
                                    ${s.courses.map(c => `
                                        <div class="flex justify-between text-xs font-medium">
                                            <span class="font-mono text-gray-500">${c.code} (${c.unit} Units)</span>
                                            <span class="font-bold">${c.score !== null ? c.score : '-'} / <span class="${c.grade==='A'?'text-brand-green':'text-brand-blue'}">${c.grade} (${c.qp} QP)</span></span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')
                    }
                </div>
            `;
        }

        // VIEW 3: PLANNER
        function renderPlanner(container) {
            container.innerHTML = `
                <div class="fade-in space-y-6 max-w-4xl mx-auto">
                    <div class="glass p-6 rounded-3xl space-y-3">
                        <h3 class="font-bold text-sm uppercase tracking-wider text-gray-400">Add Academic Task</h3>
                        <div class="flex gap-2">
                            <input type="text" id="task-input" placeholder="e.g., Read Chapter 4 of POS 201" class="flex-1 p-3.5 rounded-2xl text-xs font-semibold">
                            <button onclick="addTask()" class="px-6 py-3.5 rounded-2xl text-xs font-bold text-white grad-primary shadow-md">Add</button>
                        </div>
                    </div>

                    <div class="glass p-6 rounded-3xl">
                        <h3 class="font-extrabold text-lg mb-4">Task List</h3>
                        <div id="task-list" class="space-y-2">
                            ${currentUser.planner.tasks.map((t, i) => `
                                <div class="flex items-center justify-between p-3.5 rounded-2xl glass hover:opacity-90 transition">
                                    <div class="flex items-center gap-3">
                                        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${i})" class="w-4 h-4 rounded accent-purple-600">
                                        <span class="text-xs font-semibold ${t.done ? 'line-through text-gray-400' : ''}">${t.title}</span>
                                    </div>
                                    <button onclick="deleteTask(${i})" class="text-brand-red text-xs font-bold px-2">✕</button>
                                </div>
                            `).join('') || '<p class="text-xs text-gray-400 text-center py-6">No tasks added yet.</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function addTask() {
            const input = document.getElementById('task-input');
            if (!input.value.trim()) return;
            currentUser.planner.tasks.push({ title: input.value.trim(), done: false });
            saveDB();
            switchView('planner');
        }

        function toggleTask(i) {
            currentUser.planner.tasks[i].done = !currentUser.planner.tasks[i].done;
            saveDB();
            switchView('planner');
        }

        function deleteTask(i) {
            currentUser.planner.tasks.splice(i, 1);
            saveDB();
            switchView('planner');
        }

        // VIEW 4: FINANCE
        function renderFinance(container) {
            const fin = currentUser.finance;
            const spent = fin.transactions.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
            const remaining = fin.semesterBudget - spent;

            container.innerHTML = `
                <div class="fade-in space-y-6 max-w-4xl mx-auto">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div class="glass p-6 rounded-3xl">
                            <p class="text-[10px] font-black uppercase tracking-wider text-gray-400">SEMESTER BUDGET</p>
                            <p class="text-3xl font-black mt-2">₦${fin.semesterBudget.toLocaleString()}</p>
                        </div>
                        <div class="glass p-6 rounded-3xl border-l-4 border-brand-red">
                            <p class="text-[10px] font-black uppercase tracking-wider text-gray-400">TOTAL SPENT</p>
                            <p class="text-3xl font-black text-brand-red mt-2">₦${spent.toLocaleString()}</p>
                        </div>
                        <div class="glass p-6 rounded-3xl border-l-4 border-brand-green">
                            <p class="text-[10px] font-black uppercase tracking-wider text-gray-400">REMAINING</p>
                            <p class="text-3xl font-black text-brand-green mt-2">₦${remaining.toLocaleString()}</p>
                        </div>
                    </div>

                    <div class="glass p-6 rounded-3xl space-y-4">
                        <h3 class="font-extrabold text-lg">Log Expense / Allowance</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <input type="number" id="fin-amt" placeholder="Amount (₦)" class="p-3.5 rounded-2xl text-xs font-semibold">
                            <input type="text" id="fin-desc" placeholder="Description (e.g., Handouts)" class="p-3.5 rounded-2xl text-xs font-semibold">
                            <button onclick="addTransaction()" class="py-3.5 rounded-2xl text-xs font-bold text-white bg-brand-green shadow-md">Log Transaction</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function addTransaction() {
            const amt = parseFloat(document.getElementById('fin-amt').value);
            const desc = document.getElementById('fin-desc').value.trim();
            if (!amt || !desc) return alert("Please complete both amount and description.");

            currentUser.finance.transactions.push({ amount: amt, desc, type: 'expense', date: Date.now() });
            saveDB();
            switchView('finance');
        }

        // VIEW 5: MORE
        function renderMore(container) {
            container.innerHTML = `
                <div class="fade-in space-y-6 max-w-4xl mx-auto">
                    <div class="glass p-6 rounded-3xl space-y-4">
                        <h3 class="font-extrabold text-lg">Profile & System Preferences</h3>
                        <div class="text-xs space-y-2 text-gray-500 dark:text-slate-400">
                            <p><b>User:</b> ${currentUser.name} (${DB.current})</p>
                            <p><b>Institution:</b> ${currentUser.profile.uni}</p>
                            <p><b>Program:</b> ${currentUser.profile.program}</p>
                            <p><b>Core Engine Version:</b> Authoritative Academic Engine v5.0</p>
                        </div>
                    </div>

                    <div class="glass p-6 rounded-3xl border border-brand-red/20 space-y-3">
                        <h3 class="font-bold text-sm text-brand-red uppercase tracking-wider">Danger Zone</h3>
                        <button onclick="if(confirm('Reset all academic data?')){localStorage.clear(); location.reload();}" class="w-full py-3.5 rounded-2xl text-xs font-bold text-brand-red bg-brand-red/10 hover:bg-brand-red/20 transition">
                            Clear Local Storage Data
                        </button>
                    </div>
                </div>
            `;
        }

        // INITIALIZATION
        window.onload = function() {
            const savedTheme = localStorage.getItem('as_theme') || 'dark';
            if (savedTheme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            updateThemeIcons();

            if (DB.current && DB.users[DB.current]) {
                initApp();
            } else {
                showAuthScreen('screen-welcome');
            }
        };
    </script>
</body>
</html>
