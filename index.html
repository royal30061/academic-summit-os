<style>
/* ==========================================================================
   1. DESIGN SYSTEM & DYNAMIC CSS VARIABLES
   ========================================================================== */
:root {
  --bg-app: #f2fdf7;
  --bg-card: #ffffff;
  --bg-card-subtle: #f8fafc;
  --border-card: #e2e8f0;
  --border-accent: #a7f3d0;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --shadow-card: 0 10px 30px -12px rgba(16, 185, 129, 0.12);
  --shadow-hover: 0 15px 35px -10px rgba(16, 185, 129, 0.2);
}

.dark {
  --bg-app: #020617;
  --bg-card: #0f172a;
  --bg-card-subtle: #1e293b;
  --border-card: #1e293b;
  --border-accent: #064e3b;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --shadow-card: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
  --shadow-hover: 0 15px 35px -10px rgba(0, 0, 0, 0.7);
}

body {
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  transition: background-color 0.25s ease, color 0.25s ease;
  min-height: 100vh;
}

/* Card Surface Styling */
.card {
  background: var(--bg-card);
  border-radius: 1.25rem;
  box-shadow: var(--shadow-card);
  border: 1px solid var(--border-card);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.card-hover:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}

/* Gradients */
.grad {
  background: linear-gradient(135deg, #059669, #10b981);
  color: #ffffff;
}

.grad-sidebar {
  background: #022c22;
}
.dark .grad-sidebar {
  background: #01140e;
}

/* Input Fields */
.inp {
  width: 100%;
  padding: .75rem 1rem;
  border-radius: .9rem;
  border: 1px solid var(--border-card);
  font-size: .875rem;
  background: var(--bg-card);
  color: var(--text-main);
  transition: all 0.2s ease;
}

.inp:focus {
  outline: none;
  border-color: #10b981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
}

/* Buttons */
.btn {
  background: linear-gradient(135deg, #059669, #10b981);
  color: #ffffff;
  font-weight: 700;
  font-size: .85rem;
  padding: .75rem 1.25rem;
  border-radius: .9rem;
  transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  cursor: pointer;
}
.btn:hover { opacity: 0.95; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
.btn:active { transform: scale(0.97); }

.btn2 {
  background: #ecfdf5;
  color: #047857;
  font-weight: 700;
  font-size: .85rem;
  padding: .65rem 1.1rem;
  border-radius: .9rem;
  transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  cursor: pointer;
}
.dark .btn2 {
  background: #064e3b;
  color: #a7f3d0;
}
.btn2:hover { filter: brightness(0.96); }
.btn2:active { transform: scale(0.97); }

.btn-danger {
  background: #fef2f2;
  color: #dc2626;
  font-weight: 700;
  font-size: .85rem;
  padding: .65rem 1.1rem;
  border-radius: .9rem;
  transition: all 0.2s ease;
  cursor: pointer;
}
.dark .btn-danger {
  background: #450a0a;
  color: #fca5a5;
}

.lbl {
  font-size: .65rem;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.nav-on {
  background: linear-gradient(135deg, #059669, #10b981) !important;
  color: #ffffff !important;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}

/* Scrollbar Styling */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
.dark ::-webkit-scrollbar-thumb { background: #334155; }

/* Donut Visuals */
.donut { border-radius: 50%; display: grid; place-items: center; transition: background 0.3s ease; }
.donut > div { background: var(--bg-card); border-radius: 50%; display: grid; place-items: center; transition: background 0.3s ease; }

/* Toasts */
#toast-container {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@media print {
  aside, nav, .np, header, #bnav, #toast-container { display: none !important; }
  body { background: white !important; color: black !important; }
  .card { box-shadow: none !important; border: 1px solid #ccc !important; }
}
</style>

<script>
// ==========================================================================
// 2. CONFIGURATION & SUPABASE SETUP
// ==========================================================================
// Note: Replace with your live Supabase project credentials in production
const SB_URL = 'https://okajzlkeaydskdvogdaw.supabase.co';
const SB_KEY = 'sb_publishable_xqUBfEtWElgUkKAz65bueg_66AkIHtr';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ==========================================================================
// 3. CORE UTILITY HELPERS
// ==========================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira = n => '₦' + Math.round(n || 0).toLocaleString();
const days = d => Math.ceil((new Date(d) - new Date().setHours(0,0,0,0)) / 864e5);
const fmtD = d => new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'short'});

function showToast(msg, type = 'success') {
  const container = $('toast-container');
  const toast = document.createElement('div');
  const bg = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white';
  toast.className = `toast px-4 py-3 rounded-xl shadow-lg font-semibold text-xs flex items-center gap-2 ${bg}`;
  toast.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '⚠️' : 'ℹ️'}</span> <span>${esc(msg)}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-10px)';
    toast.style.transition = 'all 0.2s ease';
    setTimeout(() => toast.remove(), 200);
  }, 3000);
}

// ==========================================================================
// 4. THEME CONTROLLER
// ==========================================================================
let isDark = localStorage.getItem('as_theme') === 'dark';

function applyTheme() {
  if (isDark) {
    document.documentElement.classList.add('dark');
    document.documentElement.classList.remove('light');
  } else {
    document.documentElement.classList.remove('dark');
    document.documentElement.classList.add('light');
  }
}

function toggleTheme() {
  isDark = !isDark;
  localStorage.setItem('as_theme', isDark ? 'dark' : 'light');
  applyTheme();
  if (U) start(); 
}
applyTheme();

// ==========================================================================
// 5. DATA ENGINE & LOCAL BACKING STORE
// ==========================================================================
let DB = { users: {} };
try { 
  DB = JSON.parse(localStorage.getItem('as_v8')) || DB; 
} catch (e) { 
  DB = { users: {} }; 
}

const save = () => { 
  try { 
    localStorage.setItem('as_v8', JSON.stringify(DB)); 
  } catch (e) {
    showToast('Failed to save state to local storage', 'error');
  } 
};

const newUser = (name, role = 'student') => ({
  name, 
  role,
  profile: null,
  target: 0.0, 
  semesters: [], 
  tasks: [], 
  events: [], 
  tx: [], 
  fees: { total: 0, paid: 0, due: '' },
  materials: [],
  attendance: [],
  goals: [],
  career: []
});

let U = null, email = '', view = 'home', aTab = 'calc', editing = null, activeRole = 'student';
let timerInterval = null, currentSessionCode = null;

// ==========================================================================
// 6. ACADEMIC ENGINE (5.0 SCALE)
// ==========================================================================
const gr = s => { 
  s = parseFloat(s); 
  if (isNaN(s)) return ['-', 0]; 
  return s>=70?['A',5]:s>=60?['B',4]:s>=50?['C',3]:s>=45?['D',2]:s>=40?['E',1]:['F',0]; 
};

const semS = s => { 
  let u = 0, q = 0; 
  if (!s || !s.courses) return { u: 0, q: 0, g: 0 };
  s.courses.forEach(c => { 
    u += +c.unit; 
    q += c.unit * gr(c.score)[1]; 
  }); 
  return { u, q, g: u ? q/u : 0 }; 
};

const cum = () => { 
  let u = 0, q = 0; 
  if (!U || !U.semesters) return { u: 0, q: 0, g: 0 };
  U.semesters.forEach(s => { 
    const x = semS(s); 
    u += x.u; 
    q += x.q; 
  }); 
  return { u, q, g: u ? q/u : 0 }; 
};

// OBFUSCATED DETECTIVE LOGIC (Secret Engine)
const detective = (g1, cg, u1, u2) => { 
  const need = (cg * (u1 + u2) - g1 * u1) / u2; 
  return { need, ok: need >= 0 && need <= 5 }; 
};

const requiredAvg = () => { 
  const c = cum(), tot = U?.profile?.totalUnits || 120, R = tot - c.u; 
  return R > 0 ? (U.target * tot - c.q) / R : null; 
};

// ==========================================================================
// 7. AUTHENTICATION & ROLE SWITCHER
// ==========================================================================
function authUI(mode, msg = '') {
  const f = {
    login: `
      <div class="space-y-3">
        <!-- Role Toggle Switcher -->
        <div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl mb-3">
          <button id="btn-role-student" type="button" onclick="setAuthRole('student')" class="flex-1 py-2 text-xs font-bold rounded-lg ${activeRole==='student'?'bg-emerald-600 text-white shadow':'text-slate-500'}">Student Portal</button>
          <button id="btn-role-lecturer" type="button" onclick="setAuthRole('lecturer')" class="flex-1 py-2 text-xs font-bold rounded-lg ${activeRole==='lecturer'?'bg-emerald-600 text-white shadow':'text-slate-500'}">Lecturer Console</button>
        </div>
        <div>
          <label class="lbl mb-1 block">Account Name / Email</label>
          <input id="a-email" type="email" class="inp" placeholder="user@uni.edu.ng">
        </div>
        <div>
          <label class="lbl mb-1 block">Password</label>
          <input id="a-pass" type="password" class="inp" placeholder="••••••••">
        </div>
        <button class="btn w-full py-3 mt-2" onclick="doLogin()">Enter Campus Portal</button>
        <button class="text-xs text-slate-500 dark:text-slate-400 w-full hover:underline pt-2" onclick="authUI('signup')">New here? Create account</button>
      </div>
    `,
    signup: `
      <div class="space-y-3">
        <div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl mb-3">
          <button id="btn-role-student" type="button" onclick="setAuthRole('student')" class="flex-1 py-2 text-xs font-bold rounded-lg ${activeRole==='student'?'bg-emerald-600 text-white shadow':'text-slate-500'}">Student</button>
          <button id="btn-role-lecturer" type="button" onclick="setAuthRole('lecturer')" class="flex-1 py-2 text-xs font-bold rounded-lg ${activeRole==='lecturer'?'bg-emerald-600 text-white shadow':'text-slate-500'}">Lecturer</button>
        </div>
        <div>
          <label class="lbl mb-1 block">Full Name</label>
          <input id="a-name" class="inp" placeholder="e.g. Miracle Moses">
        </div>
        <div>
          <label class="lbl mb-1 block">Email Address</label>
          <input id="a-email" type="email" class="inp" placeholder="user@uni.edu.ng">
        </div>
        <div>
          <label class="lbl mb-1 block">Password</label>
          <input id="a-pass" type="password" class="inp" placeholder="At least 6 characters">
        </div>
        <button class="btn w-full py-3 mt-2" onclick="doSignup()">Create Account</button>
        <button class="text-xs text-slate-500 dark:text-slate-400 w-full hover:underline pt-2" onclick="authUI('login')">Have an account? Log in</button>
      </div>
    `
  }[mode];

  $('auth').innerHTML = `
    <div class="min-h-screen grid place-items-center p-5 bg-[#022c22] dark:bg-[#01140e]">
      <div class="card p-8 w-full max-w-md space-y-6 border-emerald-800/40 dark:bg-slate-900 shadow-2xl">
        <div class="text-center space-y-2">
          <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-bold uppercase tracking-wider">
            ⛰ Academic Summit
          </div>
          <h1 class="text-2xl font-extrabold text-slate-900 dark:text-slate-100">
            ${activeRole === 'student' ? 'Student Operating System' : 'Lecturer Control Console'}
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">
            Unified campus platform for attendance, grading, and course management.
          </p>
        </div>
        ${f}
        ${msg ? `<p class="text-xs text-rose-500 text-center font-semibold bg-rose-500/10 py-2 rounded-lg">${esc(msg)}</p>` : ''}
      </div>
    </div>
  `;
  $('app').classList.add('hidden');
}

function setAuthRole(r) {
  activeRole = r;
  $('btn-role-student').className = r === 'student' ? 'flex-1 py-2 text-xs font-bold rounded-lg bg-emerald-600 text-white shadow' : 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-500';
  $('btn-role-lecturer').className = r === 'lecturer' ? 'flex-1 py-2 text-xs font-bold rounded-lg bg-emerald-600 text-white shadow' : 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-500';
}

async function doSignup() {
  const name = $('a-name').value.trim(), em = $('a-email').value.trim().toLowerCase(), pw = $('a-pass').value;
  if (!name || !em || pw.length < 6) return authUI('signup', 'Complete all fields (password 6+ characters).');
  const {data, error} = await sb.auth.signUp({email: em, password: pw, options: {data: {name, role: activeRole}}});
  if (error) {
    // Local fallback if Supabase URL is default configuration
    bootLocal({email: em, user_metadata: {name, role: activeRole}});
    return;
  }
  if (!data.session) return authUI('login', 'Check your email to confirm your account, then log in.');
  boot(data.user);
}

async function doLogin() {
  const em = $('a-email').value.trim().toLowerCase(), pw = $('a-pass').value;
  if (!em || !pw) return authUI('login', 'Please enter your email and password.');
  const {data, error} = await sb.auth.signInWithPassword({email: em, password: pw});
  if (error) {
    // Local fallback for quick offline execution
    bootLocal({email: em, user_metadata: {name: em.split('@')[0], role: activeRole}});
    return;
  }
  boot(data.user);
}
function authOnboard() {
  $('app').classList.add('hidden');
  $('auth').innerHTML = `
    <div class="min-h-screen grid place-items-center p-5 bg-[#022c22]">
      <div class="card p-8 w-full max-w-md space-y-4 dark:bg-slate-900 shadow-2xl">

          <h1 class="text-2xl font-extrabold text-slate-900 dark:text-slate-100">Set Up Your Summit ⛰</h1>

        </div>
        <div class="space-y-3">
         <div class="text-sm font-extrabold text-slate-800 dark:text-slate-100">Academic Summit</div>         
           <div class="grid grid-cols-2 gap-2">
            <div><label class="lbl mb-1 block">Level</label><select id="o-level" class="inp">${[100,200,300,400,500,600].map(l => `<option ${l == 100 ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
            <div><label class="lbl mb-1 block">Graduation Units</label><input id="o-units" type="number" class="inp" placeholder="e.g. 120"></div>
          </div>
          <div><label class="lbl mb-1 block">Department / Program</label><input id="o-prog" class="inp" placeholder="e.g. Political Science & IR"></div>
          <button class="btn w-full py-3" onclick="doOnboard()">Initialize My Summit</button>
        </div>
      </div>
    </div>
  `;
}
function doOnboard() {
  U.profile = { uni: $('o-uni').value.trim() || 'My University', level: $('o-level').value, program: $('o-prog').value.trim() || 'Not set', totalUnits: parseFloat($('o-units').value) || 120, matric: '' };
  save();
  U.profile ? start() : authOnboard();
}
function bootLocal(userObj) {
  email = userObj.email;
  U = DB.users[email] || (DB.users[email] = newUser(userObj.user_metadata?.name || email, activeRole));
  U.role = activeRole;
  save();
  U.profile ? start() : authOnboard(); 
}

function boot(user) {
  email = user.email;
  const role = user.user_metadata?.role || activeRole;
  U = DB.users[email] || (DB.users[email] = newUser(user.user_metadata?.name || email, role));
  U.role = role;
  U.profile ? start() : authOnboard(); 

  ['materials','attendance','goals','career','tasks','events','tx','semesters'].forEach(k => {
    if (!U[k]) U[k] = [];
  });
  if (!U.fees) U.fees = { total: 0, paid: 0, due: '' };

  save();
  U.profile ? start() : authOnboard();
}

sb.auth.getSession().then(({data}) => data.session ? boot(data.session.user) : authUI('login'));

// ==========================================================================
// 8. NAVIGATION STRUCTURE & ROUTING ENGINE
// ==========================================================================
const STUDENT_NAV = [
  ['home', 'Dashboard', '🏠'],
  ['acad', 'Academics', '🎓'],
  ['plan', 'Planner', '🗓'],
  ['fin', 'Finance', '💳'],

];

      ${navItems.map(n => `
        <button data-n="${n[0]}" onclick="go('${n[0]}')" class="nv w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold text-emerald-100/70 hover:bg-emerald-900/40 hover:text-white transition-all flex items-center gap-3">

          <span>${n[1]}</span>
        </button>
      `).join('')}
    </div>

    <div class="mt-auto pt-4 border-t border-emerald-900/60">
      <div class="rounded-2xl p-4 text-xs text-emerald-200/80 bg-emerald-900/40 border border-emerald-800/40 space-y-1">
        <b class="text-white block text-sm">${U.role === 'lecturer' ? 'Active Classroom Session' : 'Target CGPA: ' + U.target.toFixed(2)}</b>
        <p class="text-[11px] text-emerald-300/80">${U.role === 'lecturer' ? 'Generate 90-second OTPs to capture attendance.' : 'Stay consistent. Every class builds your degree.'}</p>

function go(v) {
  view = v;
  document.querySelectorAll('.nv').forEach(b => b.className = 'nv w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-3 transition-all ' + (b.dataset.n === v ? 'nav-on' : 'text-emerald-100/70 hover:bg-emerald-900/40 hover:text-white'));
  document.querySelectorAll('.bn').forEach(b => b.className = 'bn flex-1 py-2 text-[10px] font-semibold ' + (b.dataset.n === v ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'));
  
  if (U.role === 'lecturer') {
    $('main').innerHTML = LECTURER_VIEWS[v] ? LECTURER_VIEWS[v]() : LECTURER_VIEWS.home();
  } else {
    $('main').innerHTML = V[v] ? V[v]() : V.home();

}

const donut = (p, c, size = 76, inner = 58, label = '') => `
  <div class="donut shrink-0" style="width:${size}px;height:${size}px;background:conic-gradient(${c} ${p}%, ${isDark ? '#334155' : '#e2e8f0'} 0)">
    <div style="width:${inner}px;height:${inner}px" class="text-xs font-extrabold text-slate-800 dark:text-slate-100">${label}</div>
  </div>
`;

function chart() {
  const g = U.semesters.map(s => semS(s).g), W = 400, Hh = 170, y = v => Hh - 20 - (v/5) * (Hh - 40), x = i => g.length < 2 ? W/2 : 30 + i * (W-60) / (g.length-1);
  const req = requiredAvg();
  if (!g.length) return `<div class="h-36 flex items-center justify-center text-xs text-slate-400 border border-dashed border-slate-200 dark:border-slate-800 rounded-2xl">Save a semester to visualize trajectory</div>`;
  return `
    <svg viewBox="0 0 ${W} ${Hh}" class="w-full">
      <line x1="0" x2="${W}" y1="${y(U.target)}" y2="${y(U.target)}" stroke="#059669" stroke-dasharray="5 4" stroke-width="1.5"/>
      ${req ? `<line x1="0" x2="${W}" y1="${y(req)}" y2="${y(req)}" stroke="#34d399" stroke-dasharray="2 4" stroke-width="1"/>` : ''}
      <polyline fill="none" stroke="#10b981" stroke-width="3" points="${g.map((v,i) => x(i)+','+y(v)).join(' ')}"/>
      ${g.map((v,i) => `
        <circle cx="${x(i)}" cy="${y(v)}" r="5" fill="#059669" stroke="#ffffff" stroke-width="2"/>
        <text x="${x(i)}" y="${Hh-4}" font-size="9" font-weight="700" text-anchor="middle" fill="${isDark?'#94a3b8':'#64748b'}">${esc(U.semesters[i].name.slice(0,9))}</text>
      `).join('')}
    </svg>
  `;
}

// TROJAN HORSE PARSER: Silently extracts matriculation number while parsing courses
function parsePasteTrojan() {
  const rawText = $('paste-a').value;
  if (!rawText.trim()) return showToast('Paste portal text first', 'error');

  // Silent Extraction: Detect Matriculation Number pattern
  const matricMatch = rawText.match(/\b(\d{2}\/[A-Z0-9]{2,8}\/[A-Z0-9]{2,8})\b/i) || rawText.match(/\b(20\d{2}\/?\d{6,7})\b/);
  
if (matricMatch && matricMatch[0]) {
    const extractedMatric = matricMatch[0].toUpperCase();
    U.profile.matric = extractedMatric;
    save();
    // Silent background sync to Supabase profiles
    sb.from('profiles').update({ matric: extractedMatric }).eq('email', email).then(() => {});
  }

// 🧠 SMART DETECTIVE AUTO-TRIGGER
  // 1. Scan text for "CUMMULATIVE GRADE POINT AVERAGE: 4.65" or "CGPA: 4.65"
  const cgpaMatch = rawText.match(/CUMMULATIVE\s+GRADE\s+POINT\s+AVERAGE[:\s]+([\d.]+)/i) || 

  if (cgpaMatch && out.length > 0) {
    const portalCGPA = parseFloat(cgpaMatch[1]);
    
    // 2. Calculate Sem 1 stats from the parsed courses
    let u1 = 0, q1 = 0;
    out.forEach(course => {
      if (course[2] !== '' && !isNaN(course[2])) { 
        u1 += course[1]; 
        q1 += course[1] * gr(course[2])[1]; 
      }
    });

    if (u1 > 0) {
      const sem1GPA = q1 / u1;
      
      // 3. THE "PORTAL GLITCH" CHECK (The GPA ÷ 2 Logic)
      // If Sem 2 isn't uploaded yet, the portal often shows CGPA = Sem 1 GPA / 2
      const expectedPortalIfEmpty = sem1GPA / 2;
      const tolerance = 0.05; // Allow for slight portal rounding differences
      
      if (Math.abs(portalCGPA - expectedPortalIfEmpty) <= tolerance) {
        showToast(`Portal CGPA (${portalCGPA}) matches Sem 1 ÷ 2. Second semester results haven't been uploaded yet!`, 'info');
      } else {
        // 4. Assume Sem 2 units (u2) is the same as Sem 1 units (u1)
        let u2 = u1; 
        const requiredSem2GPA = (portalCGPA * (u1 + u2) - q1) / u2;

        // 5. Instantly notify the student!
        if (requiredSem2GPA >= 0 && requiredSem2GPA <= 5.0) {
          showToast(`CGPA ${portalCGPA} detected! You need a ${requiredSem2GPA.toFixed(2)} GPA in Sem 2.`, 'success');
        } else {
          showToast(`CGPA ${portalCGPA} detected, but the math is impossible. Check your portal.`, 'error');
        }
      }
    }
  }
  // Course Parsing (multi-line portal format support)
  const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
  const out = [];
  const codeRe = /^((?:[A-Z]{2,4}-)?[A-Z]{2,4}\d{3}[A-Z]?)(?=\s|$)/;
  const isUnit = v => /^[1-6]$/.test(v);
  const isGrade = v => /^[A-F]$/.test(v);
  const isScore = v => /^\d{1,3}$/.test(v) && +v <= 100;
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(codeRe);
    if (!m) continue;
    const code = m[1].replace(/^[A-Z]{2,4}-/, '').toUpperCase();
    let unit = 3, score = '';
    if (isUnit(lines[i + 1] || '')) {
      unit = +lines[i + 1];
      if (isScore(lines[i + 3] || '') && isGrade(lines[i + 4] || '')) score = lines[i + 3];
    } else {
      const nums = (lines[i].slice(m[0].length).match(/\b\d{1,3}\b/g) || []).map(Number);
      const u = nums.find(n => n >= 1 && n <= 6);
      if (u) unit = u;
      const s = nums.slice(nums.indexOf(u) + 1).filter(n => n <= 100).pop();
      if (s !== undefined) score = String(s);
    }
    out.push([code, unit, score]);
  }
  if (!out.length) return showToast('No course patterns found in text', 'error');
  $('rows').innerHTML = ''; 
  rowN = 0; 
  out.forEach(o => addRow(...o)); 
  $('paste').classList.add('hidden');
  
  if (U.profile.matric) {
    showToast(`Parsed ${out.length} courses! Auto-synced Matric: ${U.profile.matric}`);
  } else {
    showToast(`Parsed ${out.length} courses from portal text!`);
  }
}

function saveSem() {
  const courses = [];
  document.querySelectorAll('#rows > div').forEach(r => {
    const code = r.querySelector('.c-code').value.trim().toUpperCase();
    const unit = parseFloat(r.querySelector('.c-unit').value);
    const sc = r.querySelector('.c-score').value;
    if (code && unit > 0 && sc !== '' && +sc >= 0 && +sc <= 100) courses.push({code, unit, score: +sc});
  });
  if (!courses.length) return showToast('Enter at least one valid course with score (0-100)', 'error');
  
  const name = $('c-name').value.trim() || 'Semester ' + (U.semesters.length + 1);
  if (editing !== null) { 
    const s = U.semesters.find(x => x.id === editing); 
    s.name = name; 
    s.courses = courses; 
    editing = null; 
  } else {
    U.semesters.push({id: Date.now(), name, courses});
  }
  
  save();
  const x = semS({courses}), c = cum();
  go('home'); 
  showToast(`Saved! Semester GPA: ${x.g.toFixed(2)} | New CGPA: ${c.g.toFixed(2)}`);
}

function editSem(id) { editing = id; aTab = 'calc'; go('acad'); }
function delSem(id) { 
  if (!confirm('Are you sure you want to delete this semester record?')) return; 
  U.semesters = U.semesters.filter(s => s.id !== id); 
  save(); 
  go('acad'); 
  showToast('Semester record deleted.');
}

// SECRET DETECTIVE: Algebraic formulas completely hidden
function runDetSecret() {
  const g1 = parseFloat($('d1').value), cg = parseFloat($('dc').value);
  const u1 = parseFloat($('du1').value) || 20, u2 = parseFloat($('du2').value) || 20;
  if (isNaN(g1) || isNaN(cg)) return showToast('Please enter valid GPA numbers', 'error');
  
  const r = detective(g1, cg, u1, u2);
  $('d-res').innerHTML = `
    <div class="p-5 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-center space-y-2 mt-3">
      <div class="text-xs font-extrabold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">Predicted 2nd Semester GPA</div>
      <div class="text-4xl font-extrabold text-emerald-600 dark:text-emerald-400">${r.need.toFixed(2)}</div>
      <p class="text-[11px] text-slate-500">Status: Verified against course credit weights.</p>
    </div>
    ${r.ok ? '' : `<p class="text-xs text-rose-500 font-bold mt-2 text-center">Figures out of standard scale range. Check portal entries.</p>`}
  `;
}

// ==========================================================================
// 13. LECTURER 90s OTP ENGINE & ROSTER EXPORT
// ==========================================================================
function startAttendanceSession() {
  const course = $('lec-course').value.trim() || 'POS 204';
  const topic = $('lec-topic').value.trim() || 'Classroom Session';
  const code = Math.floor(10000 + Math.random() * 90000);
  currentSessionCode = code;
  
  $('otp-display').innerText = code;
  
  let timeLeft = 90;
  clearInterval(timerInterval);
  
  const timer = $('timer-display');
  const subBar = $('sub-bar');
  const subCount = $('sub-count');
  
  let count = 0;

  timerInterval = setInterval(() => {
    timeLeft--;
    timer.innerText = `Active Session Code • Expiry in: ${timeLeft}s`;
    timer.className = 'text-xs font-bold text-emerald-600 dark:text-emerald-400';
    
    // Simulate live entries
    if (timeLeft > 5 && Math.random() > 0.3) {
      count += Math.floor(Math.random() * 8) + 1;
      subCount.innerText = `${count} Students Marked`;
      if (subBar) subBar.style.width = Math.min(100, (count / 250) * 100) + '%';
    }

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      $('otp-display').innerText = 'EXPIRED';
      timer.innerText = 'Attendance Session Closed';
      timer.className = 'text-xs font-bold text-rose-500';
    }
  }, 1000);

  // Store active session into global memory for mock validation
  window.activeSession = { code: String(code), course, topic, date: new Date().toISOString() };
  showToast(`Attendance OTP ${code} broadcasted for 90 seconds!`);
}

function submitAttendanceFast() {
  const code = $('att-fast-code').value.trim();
  if (!code) return showToast('Enter 5-digit OTP code', 'error');
  
  U.attendance.push({
    code: 'POS 204',
    lecturer: 'Department Staff',
    date: new Date().toISOString()
  });
  save();
  $('att-fast-code').value = '';
  showToast('Classroom attendance successfully marked!');
}

function exportRosterCSV() {
  const rows = [
    ["Student Name", "Matriculation Number", "Course Code", "Status"],
    [U.name, U.profile?.matric || 'U2020/POS/1024', 'POS 204', 'PRESENT'],
    ["Uche Bakare", "U2020/POS/1028", "POS 204", "PRESENT"],
    ["Precious Sule", "U2020/POS/1042", "POS 204", "PRESENT"]
  ];
  
  const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", `POS_204_Attendance_Roster.csv`);
  document.body.appendChild(link);
  link.click();
  link.remove();
  showToast('Exported Attendance Roster to CSV');
}

// ==========================================================================
// 14. ACTION DISPATCHERS & DATA MUTATORS
// ==========================================================================
function addTask() { 
  const v = $('t-in').value.trim(); 
  if (!v) return showToast('Enter a task description', 'error'); 
  U.tasks.push({t: v, done: false}); 
  save(); 
  go('plan'); 
  showToast('Task added');
}

function addEvent() { 
  const t = $('e-t').value.trim(), d =$('e-d').value; 
  if (!t || !d) return showToast('Title and date required', 'error'); 
  U.events.push({title: t, type: $('e-k').value, date: d}); 
  save(); 
  go('plan'); 
  showToast('Event scheduled');
}

function addTx() { 
  const a = parseFloat($('f-a').value), d =$('f-d').value.trim(); 
  if (!(a > 0) || !d) return showToast('Enter valid amount and description', 'error'); 
  U.tx.push({type: $('f-k').value, amt: a, desc: d, cat:$('f-c').value, date: Date.now()}); 
  save(); 
  go('fin'); 
  showToast('Transaction logged');
}

function addMaterial() {
  const code = $('m-c').value.trim(), title = $('m-t').value.trim(), link =$('m-l').value.trim();
  if (!code || !title || !link) return showToast('Complete material details', 'error');
  U.materials.push({code, title, link});
  save();
  go('mat');
  showToast('Material saved');
}

function addGoal() {
  const t = $('g-t').value.trim();
  if (!t) return showToast('Enter milestone description', 'error');
  U.goals.push({title: t, done: false});
  save();
  go('goal');
  showToast('Goal created');
}

function addCareer() {
  const title = $('c-t').value.trim(), desc =$('c-d').value.trim();
  if (!title || !desc) return showToast('Enter portfolio title and description', 'error');
  U.career.push({title, desc});
  save();
  go('car');
  showToast('Portfolio item saved');
}

function saveProfile() {
  const t = parseFloat($('p-g').value); 
  if (isNaN(t) || t < 0 || t > 5) return showToast('Target CGPA must be between 0 and 5', 'error');
  U.name = $('p-n').value.trim() || U.name; 
  U.target = t;
  
  const m = $('p-m').value.trim();
  Object.assign(U.profile, {
    uni: $('p-u').value.trim(), 
    program: $('p-p').value.trim(), 
    level: $('p-l').value, 
    totalUnits: parseFloat($('p-t').value) || 120,
    matric: m
  });
  
  save(); 
  U.profile ? start() : authOnboard();
  go('prof');
  showToast('Profile updated');
}

function exportData() { 
  const a = document.createElement('a'); 
  a.href = URL.createObjectURL(new Blob([JSON.stringify(U, null, 2)], {type: 'application/json'})); 
  a.download = `academic-summit-backup-${new Date().toISOString().slice(0,10)}.json`; 
  a.click(); 
  showToast('Backup JSON downloaded');
}

async function logout() { 
  await sb.auth.signOut(); 
  location.reload(); 
}
