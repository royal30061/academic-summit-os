name: Academic Summit Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - native-android-migration
      - android-migration-clean
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept licenses and install SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Prepare application
        run: npm run android:web

      - name: Synchronise Capacitor
        run: npx cap sync android
        
      - name: Stable debug signing key
        env:
          B60_SERIAL_KEYSTORE_B64: ${{ secrets.B60_SERIAL_KEYSTORE_B64 }}
        run: |
          if [ -n "$B60_SERIAL_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf "%s" "$B60_SERIAL_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android -noprompt >/dev/null 2>&1 || {
              echo "::error::Secret decodes but is NOT a valid debug keystore (alias androiddebugkey / storepass android)."
              exit 1
            }
          else
            echo "::error::Tag builds require B60_SERIAL_KEYSTORE_B64 secret. Fresh debug key this run."
            exit 1
          fi

        

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then break; fi
            echo "Gradle attempt $i failed - retrying in 20s"
            sleep 20
          done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: academic-summit-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Verify signing key (hard gate)
        if: always()
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/* | tail -1)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          EXPECTED=d6ed8e76b399134a8de2cf3a5eac0447e484610cf11394d474e66d1078f003b4
          A=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 "SHA-256" | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          K=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | grep -m1 "SHA256:" | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK: $A"; echo "KEY: $K"; echo "PIN: $EXPECTED"
          if [ "$A" != "$EXPECTED" ]; then
            echo "::error::APK certificate does not match the pinned stable key - refusing to publish."; exit 1
          fi
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout site source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: academic-summit-debug
          path: apk

      - name: Publish APK to the site (root + downloads/)
        run: |
          mkdir -p downloads
          cp apk/app-debug.apk downloads/academic-summit.apk
          cp apk/app-debug.apk academic-summit.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add downloads/academic-summit.apk academic-summit.apk
          git diff --cached --quiet || git commit -m "chore: publish APK ${{ github.ref_name }}"
          git push origin HEAD:master

      - name: Private release backup
        uses: softprops/action-gh-release@v2
        with:
          files: downloads/academic-summit.apk
          name: Academic Summit ${{ github.ref_name }}
