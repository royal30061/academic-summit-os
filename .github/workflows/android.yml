
name: Academic Summit Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - native-android-migration
      - main
      - master
      - android-migration-clean

permissions:
  contents: read

jobs:
  build:
    name: Build Academic Summit APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Prepare web application
        run: npm run build:web

      - name: Verify web application
        run: |
          test -f www/index.html
          echo "Web application found"

      - name: Verify native project
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android project found"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: academic-summit-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

